<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>History</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: var(--color-background-primary, light-dark(#ffffff, #1c1c1f));
    --bg2: var(--color-background-secondary, light-dark(#f6f6f5, #242428));
    --bg3: var(--color-background-tertiary, light-dark(#ececea, #2f2f34));
    --fg: var(--color-text-primary, light-dark(#1d1d1f, #ececef));
    --fg2: var(--color-text-secondary, light-dark(#6c6c72, #a1a1aa));
    --fg3: var(--color-text-tertiary, light-dark(#a0a0a6, #6f6f78));
    --line: var(--color-border-primary, light-dark(#e4e4e2, #38383e));
    --accent: var(--color-text-info, light-dark(#3b5bdb, #8ea2ff));
    --up: var(--color-text-success, light-dark(#2b8a3e, #69db7c));
    --down: var(--color-text-danger, light-dark(#c92a2a, #ff8787));
    --radius: var(--border-radius-md, 8px);
    --sans: var(--font-sans, -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif);
    --mono: var(--font-mono, ui-monospace, "SF Mono", Menlo, monospace);
  }
  html[data-theme="light"] { color-scheme: light; }
  html[data-theme="dark"] { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--sans); font-size: 13px; line-height: 1.45; color: var(--fg); background: var(--bg); -webkit-font-smoothing: antialiased; }
  .app { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  .head { display: flex; align-items: baseline; gap: 10px; }
  h1 { margin: 0; font-size: 14px; font-weight: 600; flex: 1; }
  .state { color: var(--fg2); font-size: 12px; font-variant-numeric: tabular-nums; }
  .args { font-family: var(--mono); font-size: 12px; color: var(--fg2); background: var(--bg2); border-radius: 6px; padding: 6px 9px; white-space: pre-wrap; word-break: break-all; min-height: 30px; }
  .args .caret { display: inline-block; width: 7px; height: 13px; background: var(--fg2); vertical-align: -2px; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .bar { height: 4px; border-radius: 2px; background: var(--bg3); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 30%; background: var(--accent); border-radius: 2px; animation: slide 1.4s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(340%); } }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .stat { background: var(--bg2); border-radius: 7px; padding: 7px 9px; }
  .stat .k { font-size: 11px; color: var(--fg2); }
  .stat .v { font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums; }
  svg { display: block; width: 100%; }
  .ax { font-size: 10px; fill: var(--fg3); font-variant-numeric: tabular-nums; }
  .note { padding: 8px 10px; border-radius: 7px; background: var(--bg2); color: var(--fg2); font-size: 12.5px; }
  .note.stop { border-left: 3px solid var(--down); }
</style>
</head>
<body>
<div class="app">
  <div class="head"><h1 id="title" data-testid="title">Price history</h1><span class="state" id="state" data-testid="state">waiting for the call…</span></div>
  <div class="args" id="args" data-testid="args"><span class="caret"></span></div>
  <div class="bar" id="bar"><i></i></div>
  <div id="out" data-testid="out"></div>
</div>
<script>
// ---- the MCP Apps bridge (SEP-1865): JSON-RPC 2.0 over postMessage to the host. No SDK, nothing external.
const mcp = (() => {
  const pending = new Map(), handlers = {};
  let nextId = 1, ctx = {};
  const post = (m) => window.parent.postMessage({ jsonrpc: "2.0", ...m }, "*");
  const request = (method, params) => new Promise((resolve, reject) => {
    const id = nextId++; pending.set(id, { resolve, reject }); post({ id, method, params });
  });
  const notify = (method, params) => post({ method, params });
  function applyContext(c) {
    if (!c) return;
    ctx = { ...ctx, ...c };
    const root = document.documentElement;
    if (c.theme) root.dataset.theme = c.theme;
    const vars = c.styles && c.styles.variables;
    if (vars) for (const [k, v] of Object.entries(vars)) if (v) root.style.setProperty(k, v);
    if (c.displayMode) root.dataset.mode = c.displayMode;
    if (handlers.context) handlers.context(ctx);
  }
  window.addEventListener("message", (e) => {
    if (e.source !== window.parent) return;
    const m = e.data;
    if (!m || m.jsonrpc !== "2.0") return;
    if (m.method && m.id !== undefined) {
      if (m.method === "ui/resource-teardown" && handlers.teardown) handlers.teardown();
      if (m.method === "ui/resource-teardown" || m.method === "ping") post({ id: m.id, result: {} });
      else post({ id: m.id, error: { code: -32601, message: "method not found" } });
      return;
    }
    if (m.method) {
      if (m.method === "ui/notifications/host-context-changed") applyContext(m.params);
      const h = handlers[m.method.replace("ui/notifications/", "")];
      if (h) h(m.params || {});
      return;
    }
    const p = pending.get(m.id);
    if (!p) return;
    pending.delete(m.id);
    if (m.error) p.reject(Object.assign(new Error(m.error.message || "error"), { code: m.error.code, data: m.error.data }));
    else p.resolve(m.result);
  });
  return {
    on(name, fn) { handlers[name] = fn; },
    get context() { return ctx; },
    async start(name, appCapabilities) {
      const r = await request("ui/initialize", { appInfo: { name, version: "1.0.0" }, appCapabilities: appCapabilities || {}, protocolVersion: "2026-01-26" });
      applyContext(r && r.hostContext);
      notify("ui/notifications/initialized", {});
      // the body's own height: the document's scrollHeight never drops below the frame's
      new ResizeObserver(() => notify("ui/notifications/size-changed", {
        width: Math.ceil(document.body.getBoundingClientRect().width), height: Math.ceil(document.body.getBoundingClientRect().height),
      })).observe(document.body);
      return r;
    },
  };
})();

// ---- the life of one slow call: arguments streaming in, running, then a result or a stop
const $ = (id) => document.getElementById(id);
let t0 = 0, clock = 0, data = null;
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const money = (v) => new Intl.NumberFormat(mcp.context.locale || undefined, { style: "currency", currency: data.vs.toUpperCase(), maximumSignificantDigits: v < 1 ? 4 : 7 }).format(v);

function running(label) {
  if (!t0) { t0 = Date.now(); clock = setInterval(() => running(), 250); }
  $("state").textContent = (label || $("state").dataset.label || "running") + " · " + ((Date.now() - t0) / 1000).toFixed(0) + " s";
  if (label) $("state").dataset.label = label;
}
function done() { clearInterval(clock); $("bar").hidden = true; }

// tool-input-partial: the model is still writing the arguments; show them as they come.
mcp.on("tool-input-partial", (p) => {
  $("args").innerHTML = esc(JSON.stringify(p.arguments || {})) + '<span class="caret"></span>';
  $("state").textContent = "the agent is writing the call…";
});
mcp.on("tool-input", (p) => {
  const a = p.arguments || {};
  $("args").textContent = JSON.stringify(a);
  $("title").textContent = `${a.coin || "bitcoin"} · ${a.days || 30} days`;
  running("backfilling");
});
mcp.on("tool-result", (r) => {
  done();
  if (r.isError) { $("out").innerHTML = `<div class="note stop">${esc(((r.content || [])[0] || {}).text || "The backfill failed.")}</div>`; $("state").textContent = "failed"; return; }
  data = r.structuredContent;
  const secs = t0 ? ((Date.now() - t0) / 1000).toFixed(0) + " s" : "";
  $("state").textContent = "done" + (secs ? " in " + secs : "");
  $("title").textContent = `${data.name} · ${data.days} days`;
  draw();
});
// tool-cancelled: the user stopped the call (or it failed before a result). Nothing was kept.
mcp.on("tool-cancelled", (p) => {
  done();
  const secs = t0 ? ((Date.now() - t0) / 1000).toFixed(0) : "0";
  $("state").textContent = "stopped";
  $("out").innerHTML = `<div class="note stop" data-testid="cancelled">Stopped after ${secs} s${p.reason ? " (" + esc(p.reason) + ")" : ""}. Nothing was kept; ask again for a shorter range.</div>`;
});
mcp.on("context", () => data && draw());

function draw() {
  const ch = ((data.last / data.first - 1) * 100);
  const W = Math.max(280, $("out").clientWidth || 560), H = 130, ps = data.closes.map((d) => d.price);
  const lo = Math.min(...ps), hi = Math.max(...ps), span = hi - lo || 1;
  const line = ps.map((v, i) => `${i ? "L" : "M"}${(i / (ps.length - 1) * W).toFixed(1)} ${(6 + (hi - v) / span * (H - 12)).toFixed(1)}`).join(" ");
  const col = ch >= 0 ? "var(--up)" : "var(--down)";
  $("out").innerHTML = `<div class="stats">
      <div class="stat"><div class="k">Change</div><div class="v" style="color:${col}">${ch >= 0 ? "+" : ""}${ch.toFixed(1)}%</div></div>
      <div class="stat"><div class="k">Low</div><div class="v">${money(data.min)}</div></div>
      <div class="stat"><div class="k">High</div><div class="v">${money(data.max)}</div></div>
      <div class="stat"><div class="k">Average</div><div class="v">${money(data.avg)}</div></div></div>
    <svg viewBox="0 0 ${W} ${H + 14}" height="${H + 14}" style="margin-top:10px">
      <path d="${line} L${W} ${H} L0 ${H} Z" fill="${col}" opacity=".1"/><path d="${line}" fill="none" stroke="${col}" stroke-width="1.75"/>
      <text class="ax" x="0" y="${H + 12}">${data.closes[0].date}</text><text class="ax" x="${W}" y="${H + 12}" text-anchor="end">${data.closes[data.closes.length - 1].date}</text></svg>
    ${data.source === "sample" ? `<div class="note" style="margin-top:8px">Sample data: CoinGecko is out of reach (${esc(data.note)}).</div>` : ""}`;
}

mcp.start("crypto-ticker history");
</script>
</body>
</html>
