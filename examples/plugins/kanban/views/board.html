<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Board</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: var(--color-background-primary, light-dark(#ffffff, #1c1c1f));
    --bg2: var(--color-background-secondary, light-dark(#f6f6f5, #242428));
    --bg3: var(--color-background-tertiary, light-dark(#ececea, #2f2f34));
    --fg: var(--color-text-primary, light-dark(#1d1d1f, #ececef));
    --fg2: var(--color-text-secondary, light-dark(#6c6c72, #a1a1aa));
    --fg3: var(--color-text-tertiary, light-dark(#a0a0a6, #6f6f78));
    --line: var(--color-border-primary, light-dark(#e4e4e2, #38383e));
    --line2: var(--color-border-secondary, light-dark(#efefed, #2c2c31));
    --accent: var(--color-text-info, light-dark(#3b5bdb, #8ea2ff));
    --danger: var(--color-text-danger, light-dark(#c92a2a, #ff8787));
    --radius: var(--border-radius-md, 8px);
    --sans: var(--font-sans, -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif);
  }
  html[data-theme="light"] { color-scheme: light; }
  html[data-theme="dark"] { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.45 var(--sans); color: var(--fg); background: var(--bg); -webkit-font-smoothing: antialiased; }
  .app { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  html[data-mode="fullscreen"] .app { height: 100vh; }
  .head { display: flex; align-items: center; gap: 10px; }
  h1 { margin: 0; font-size: 14px; font-weight: 600; flex: 1; }
  .live { color: var(--fg2); font-size: 12px; display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--fg3); }
  .dot.on { background: #2f9e44; }
  button, input { font: inherit; font-size: 12px; color: var(--fg); }
  button { height: 28px; padding: 0 10px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  button:hover { background: var(--bg2); }
  .cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; min-height: 0; }
  html[data-mode="fullscreen"] .cols { flex: 1; }
  .col { background: var(--bg2); border-radius: var(--radius); padding: 8px; display: flex; flex-direction: column; gap: 6px; min-height: 120px; max-height: 360px; overflow: auto; transition: box-shadow .12s; }
  html[data-mode="fullscreen"] .col { max-height: none; }
  .col.over { box-shadow: inset 0 0 0 2px var(--accent); }
  .col h2 { margin: 0 2px 2px; font-size: 12px; font-weight: 600; color: var(--fg2); display: flex; gap: 6px; }
  .col h2 .count { color: var(--fg3); font-weight: 400; font-variant-numeric: tabular-nums; }
  .card { background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; cursor: grab; position: relative; box-shadow: 0 1px 1px rgba(0,0,0,.03); }
  .card:hover .act { opacity: 1; }
  .card.drag { opacity: .4; }
  .card.pending { opacity: .6; border-style: dashed; }
  .card.pending::after { content: "waiting for your approval"; display: block; font-size: 11px; color: var(--accent); margin-top: 3px; }
  .card.fresh { animation: fresh 2.4s ease-out; }
  @keyframes fresh { from { box-shadow: 0 0 0 2px var(--accent); } }
  .card .t { font-weight: 500; padding-right: 22px; overflow-wrap: anywhere; }
  .card .n { color: var(--fg2); font-size: 12px; margin-top: 2px; overflow-wrap: anywhere; }
  .card .id { color: var(--fg3); font-size: 11px; font-variant-numeric: tabular-nums; }
  .card .act { position: absolute; top: 5px; right: 5px; opacity: 0; height: 22px; padding: 0 6px; font-size: 11px; color: var(--fg2); }
  .new { display: flex; gap: 4px; margin-top: auto; }
  .new input { flex: 1; min-width: 0; height: 28px; border-radius: 7px; border: 1px dashed var(--line); background: transparent; padding: 0 8px; outline: none; }
  .new input:focus { border-style: solid; border-color: var(--accent); background: var(--bg); }
  .status { font-size: 12px; color: var(--fg2); }
  .status:empty { display: none; }
  .status.err { color: var(--danger); }
</style>
</head>
<body>
<div class="app">
  <div class="head">
    <h1>Board</h1>
    <span class="live" data-testid="live"><span class="dot" id="dot"></span><span id="liveText">connecting…</span></span>
    <button id="full" data-testid="fullscreen">⤢ Open in panel</button>
  </div>
  <div class="cols" id="cols" data-testid="board"></div>
  <div class="status" id="status" data-testid="status"></div>
</div>
<script>
// ---- the MCP Apps bridge (SEP-1865): JSON-RPC 2.0 over postMessage to the host. No SDK, nothing external.
const mcp = (() => {
  const pending = new Map(), handlers = {};
  let nextId = 1, ctx = {};
  const post = (m) => window.parent.postMessage({ jsonrpc: "2.0", ...m }, "*");
  const request = (method, params) => new Promise((resolve, reject) => {
    const id = nextId++; pending.set(id, { resolve, reject }); post({ id, method, params });
  });
  const notify = (method, params) => post({ method, params });
  function applyContext(c) {
    if (!c) return;
    ctx = { ...ctx, ...c };
    const root = document.documentElement;
    if (c.theme) root.dataset.theme = c.theme;
    const vars = c.styles && c.styles.variables;
    if (vars) for (const [k, v] of Object.entries(vars)) if (v) root.style.setProperty(k, v);
    if (c.displayMode) root.dataset.mode = c.displayMode;
    if (handlers.context) handlers.context(ctx);
  }
  window.addEventListener("message", (e) => {
    if (e.source !== window.parent) return;
    const m = e.data;
    if (!m || m.jsonrpc !== "2.0") return;
    if (m.method && m.id !== undefined) {
      if (m.method === "ui/resource-teardown" && handlers.teardown) handlers.teardown();
      if (m.method === "ui/resource-teardown" || m.method === "ping") post({ id: m.id, result: {} });
      else post({ id: m.id, error: { code: -32601, message: "method not found" } });
      return;
    }
    if (m.method) {
      if (m.method === "ui/notifications/host-context-changed") applyContext(m.params);
      const h = handlers[m.method.replace("ui/notifications/", "")];
      if (h) h(m.params || {});
      return;
    }
    const p = pending.get(m.id);
    if (!p) return;
    pending.delete(m.id);
    if (m.error) p.reject(Object.assign(new Error(m.error.message || "error"), { code: m.error.code, data: m.error.data }));
    else p.resolve(m.result);
  });
  return {
    on(name, fn) { handlers[name] = fn; },
    get context() { return ctx; },
    async call(name, args) {
      const r = await request("tools/call", { name, arguments: args || {} });
      if (r && r.isError) throw new Error(((r.content || [])[0] || {}).text || name + " failed");
      return r;
    },
    read: (uri) => request("resources/read", { uri }),
    message: (text) => request("ui/message", { role: "user", content: [{ type: "text", text }] }),
    setContext: (text, structuredContent) => request("ui/update-model-context", { content: [{ type: "text", text }], structuredContent }),
    openLink: (url) => request("ui/open-link", { url }),
    download: (contents) => request("ui/download-file", { contents }),
    displayMode: (mode) => request("ui/request-display-mode", { mode }),
    async start(name, appCapabilities) {
      const r = await request("ui/initialize", { appInfo: { name, version: "1.0.0" }, appCapabilities: appCapabilities || {}, protocolVersion: "2026-01-26" });
      applyContext(r && r.hostContext);
      notify("ui/notifications/initialized", {});
      // the body's own height: the document's scrollHeight never drops below the frame's
      new ResizeObserver(() => notify("ui/notifications/size-changed", {
        width: Math.ceil(document.body.getBoundingClientRect().width), height: Math.ceil(document.body.getBoundingClientRect().height),
      })).observe(document.body);
      return r;
    },
  };
})();
function why(err) {
  const reasons = { "-32031": "this view may not call that tool", "-32032": "the plugin is turned off", "-32033": "you declined it",
    "-32034": "not supported in bise", "-32035": "bise wants a click in the view first, or fewer calls: click again in a moment", "-32036": "the server restarted, try again" };
  return reasons[String(err && err.code)] || (err && err.message) || "it failed";
}

// ---- the board
const $ = (id) => document.getElementById(id);
const POLL_MS = 3000;
let board = null, seen = new Map(), pending = null, poller = 0, fails = 0;
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
function status(text, err) { $("status").textContent = text || ""; $("status").className = "status" + (err ? " err" : ""); }

function show(b) {
  // A card the agent added or moved since the last look gets a short glow.
  const fresh = new Set(board ? b.cards.filter((c) => seen.get(c.id) !== c.column + c.changed).map((c) => c.id) : []);
  board = b;
  seen = new Map(b.cards.map((c) => [c.id, c.column + c.changed]));
  const focus = document.activeElement && document.activeElement.dataset.col, draft = focus ? document.activeElement.value : "";
  $("cols").innerHTML = b.columns.map((col) => {
    const cards = b.cards.filter((c) => c.column === col.id);
    return `<section class="col" data-col="${col.id}">
      <h2>${col.title}<span class="count">${cards.length}</span></h2>
      ${cards.map((c) => `<article class="card${fresh.has(c.id) ? " fresh" : ""}${pending && pending.id === c.id ? " pending" : ""}" draggable="true" data-id="${c.id}">
        <div class="t">${esc(c.title)}</div>${c.note ? `<div class="n">${esc(c.note)}</div>` : ""}<div class="id">#${c.id}</div>
        <button class="act" data-ask="${c.id}" title="Ask the agent to split this card">Split</button></article>`).join("")}
      ${col.id === "todo" ? `<div class="new"><input data-col="todo" placeholder="+ Add a card" data-testid="new-card"></div>` : ""}
    </section>`;
  }).join("");
  if (focus) { const el = document.querySelector(`input[data-col="${focus}"]`); el.value = draft; el.focus(); }
}

async function poll() {
  clearTimeout(poller);
  try {
    const r = await mcp.call("list_cards");
    fails = 0;
    if (!board || r.structuredContent.rev !== board.rev) show(r.structuredContent);
    $("dot").classList.add("on"); $("liveText").textContent = "live";
  } catch (err) {
    fails++;
    $("dot").classList.remove("on"); $("liveText").textContent = "paused: " + why(err);
  }
  poller = setTimeout(poll, POLL_MS * Math.min(10, 2 ** fails));
}

// move_card is a tool the model sees too: bise asks for your approval before the view's call runs.
async function move(id, column) {
  const card = board.cards.find((c) => c.id === id);
  if (!card || card.column === column) return;
  const before = board;
  pending = { id };
  show({ ...board, cards: board.cards.map((c) => (c.id === id ? { ...c, column } : c)) });
  status("Moving #" + id + ": waiting for your approval in bise…");
  try { const r = await mcp.call("move_card", { id, column }); pending = null; show(r.structuredContent); status("Moved #" + id + "."); }
  catch (err) { pending = null; show(before); status("Not moved: " + why(err) + ".", true); }
}
async function add(title) {
  status("Adding: waiting for your approval in bise…");
  try { const r = await mcp.call("add_card", { title, column: "todo" }); show(r.structuredContent); status("Added."); }
  catch (err) { status("Not added: " + why(err) + ".", true); }
}

let dragged = null;
$("cols").addEventListener("dragstart", (e) => { const c = e.target.closest(".card"); if (!c) return; dragged = +c.dataset.id; c.classList.add("drag"); e.dataTransfer.effectAllowed = "move"; });
$("cols").addEventListener("dragend", () => document.querySelectorAll(".drag,.over").forEach((el) => el.classList.remove("drag", "over")));
$("cols").addEventListener("dragover", (e) => { const col = e.target.closest(".col"); if (!col || dragged == null) return; e.preventDefault(); document.querySelectorAll(".col.over").forEach((c) => c !== col && c.classList.remove("over")); col.classList.add("over"); });
$("cols").addEventListener("drop", (e) => { const col = e.target.closest(".col"); if (!col || dragged == null) return; e.preventDefault(); col.classList.remove("over"); move(dragged, col.dataset.col); dragged = null; });
$("cols").addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.matches(".new input") && e.target.value.trim()) { const t = e.target.value.trim(); e.target.value = ""; add(t); } });
$("cols").addEventListener("click", async (e) => {
  const b = e.target.closest("[data-ask]"); if (!b) return;
  const card = board.cards.find((c) => c.id === +b.dataset.ask);
  try { await mcp.message(`Split the card #${card.id} "${card.title}" into 2 to 4 smaller cards in To do, then remove it.`); status("Asked the agent to split #" + card.id + "."); }
  catch (err) { status("Not sent: " + why(err) + ".", true); }
});
$("full").onclick = async () => {
  const want = document.documentElement.dataset.mode === "fullscreen" ? "inline" : "fullscreen";
  try { const r = await mcp.displayMode(want); document.documentElement.dataset.mode = r.mode; }
  catch (err) { status("Panel: " + why(err), true); }
};

mcp.on("context", (c) => { $("full").textContent = c.displayMode === "fullscreen" ? "Back to the thread" : "⤢ Open in panel"; });
mcp.on("tool-result", (r) => { if (r.structuredContent) show(r.structuredContent); poll(); });
mcp.on("tool-cancelled", () => { status("The tool was stopped; the board still updates."); poll(); });
mcp.on("teardown", () => clearTimeout(poller));
mcp.start("kanban", { availableDisplayModes: ["inline", "fullscreen"] });
</script>
</body>
</html>
