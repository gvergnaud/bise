<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Weather</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: var(--color-background-primary, light-dark(#ffffff, #1c1c1f));
    --bg2: var(--color-background-secondary, light-dark(#f6f6f5, #242428));
    --fg: var(--color-text-primary, light-dark(#1d1d1f, #ececef));
    --fg2: var(--color-text-secondary, light-dark(#6c6c72, #a1a1aa));
    --fg3: var(--color-text-tertiary, light-dark(#a0a0a6, #6f6f78));
    --line: var(--color-border-primary, light-dark(#e4e4e2, #38383e));
    --line2: var(--color-border-secondary, light-dark(#efefed, #2c2c31));
    --accent: var(--color-text-info, light-dark(#3b5bdb, #8ea2ff));
    --warm: var(--color-text-warning, light-dark(#d9480f, #ffa94d));
    --danger: var(--color-text-danger, light-dark(#c92a2a, #ff8787));
    --sans: var(--font-sans, -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif);
  }
  html[data-theme="light"] { color-scheme: light; }
  html[data-theme="dark"] { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--sans); font-size: 13px; line-height: 1.45; color: var(--fg); background: var(--bg); -webkit-font-smoothing: antialiased; }
  .app { padding: 14px 16px; }
  .head { display: flex; align-items: baseline; gap: 10px; }
  h1 { margin: 0; font-size: 14px; font-weight: 600; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .live { color: var(--fg2); font-size: 12px; display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--fg3); }
  .dot.on { background: #2f9e44; animation: beat 2s ease-in-out infinite; }
  @keyframes beat { 50% { opacity: .35; } }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
  .seg button { font: inherit; font-size: 12px; border: 0; background: transparent; color: var(--fg2); height: 24px; padding: 0 8px; cursor: pointer; }
  .seg button.on { background: var(--bg2); color: var(--fg); }
  .now { display: flex; align-items: center; gap: 14px; margin: 10px 0 6px; }
  .temp { font-size: 38px; font-weight: 300; letter-spacing: -1px; font-variant-numeric: tabular-nums; line-height: 1; }
  .cond { font-size: 13px; }
  .cond .meta { color: var(--fg2); font-size: 12px; }
  .glyph { font-size: 28px; line-height: 1; }
  svg { display: block; width: 100%; overflow: visible; }
  .band { fill: url(#band); }
  .hi { fill: none; stroke: var(--warm); stroke-width: 2; }
  .lo { fill: none; stroke: var(--accent); stroke-width: 2; }
  .pt-hi { fill: var(--bg); stroke: var(--warm); stroke-width: 2; }
  .pt-lo { fill: var(--bg); stroke: var(--accent); stroke-width: 2; }
  .v { font-size: 11px; fill: var(--fg); font-variant-numeric: tabular-nums; text-anchor: middle; }
  .v.lo-t { fill: var(--fg2); }
  .rain { fill: var(--accent); opacity: .22; }
  .rain-t { font-size: 10px; fill: var(--fg2); text-anchor: middle; font-variant-numeric: tabular-nums; }
  .day { font-size: 11px; fill: var(--fg2); text-anchor: middle; }
  .day.today { fill: var(--fg); font-weight: 600; }
  .ic { font-size: 15px; text-anchor: middle; }
  .grid { stroke: var(--line2); }
  .foot { display: flex; gap: 10px; align-items: center; margin-top: 8px; color: var(--fg3); font-size: 11px; }
  .foot a { color: var(--fg2); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
  .foot .spacer { flex: 1; }
  .foot button { font: inherit; font-size: 11px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg2); height: 22px; padding: 0 8px; cursor: pointer; }
  .warn { margin-top: 8px; padding: 6px 9px; border-radius: 7px; background: var(--bg2); color: var(--fg2); font-size: 12px; }
  .err { color: var(--danger); }
  .skeleton { height: 190px; border-radius: 8px; background: var(--bg2); animation: beat 1.4s ease-in-out infinite; margin-top: 10px; }
</style>
</head>
<body>
<div class="app">
  <div class="head">
    <h1 id="place" data-testid="place">Weather</h1>
    <span class="live" data-testid="live"><span class="dot" id="dot"></span><span id="updated">waiting…</span></span>
    <span class="seg"><button id="c" class="on" data-testid="celsius">°C</button><button id="f" data-testid="fahrenheit">°F</button></span>
  </div>
  <div id="body"><div class="skeleton"></div></div>
  <div class="foot">
    <span>Data <a id="credit" data-testid="credit">Open-Meteo</a> · CC BY 4.0</span>
    <span class="spacer"></span>
    <button id="refresh" data-testid="refresh">Refresh now</button>
  </div>
</div>
<script>
// ---- the MCP Apps bridge (SEP-1865): JSON-RPC 2.0 over postMessage to the host. No SDK, nothing external.
const mcp = (() => {
  const pending = new Map(), handlers = {};
  let nextId = 1, ctx = {};
  const post = (m) => window.parent.postMessage({ jsonrpc: "2.0", ...m }, "*");
  const request = (method, params) => new Promise((resolve, reject) => {
    const id = nextId++; pending.set(id, { resolve, reject }); post({ id, method, params });
  });
  const notify = (method, params) => post({ method, params });
  function applyContext(c) {
    if (!c) return;
    ctx = { ...ctx, ...c };
    const root = document.documentElement;
    if (c.theme) root.dataset.theme = c.theme;
    const vars = c.styles && c.styles.variables;
    if (vars) for (const [k, v] of Object.entries(vars)) if (v) root.style.setProperty(k, v);
    if (c.displayMode) root.dataset.mode = c.displayMode;
    if (handlers.context) handlers.context(ctx);
  }
  window.addEventListener("message", (e) => {
    if (e.source !== window.parent) return;
    const m = e.data;
    if (!m || m.jsonrpc !== "2.0") return;
    if (m.method && m.id !== undefined) {
      if (m.method === "ui/resource-teardown" && handlers.teardown) handlers.teardown();
      if (m.method === "ui/resource-teardown" || m.method === "ping") post({ id: m.id, result: {} });
      else post({ id: m.id, error: { code: -32601, message: "method not found" } });
      return;
    }
    if (m.method) {
      if (m.method === "ui/notifications/host-context-changed") applyContext(m.params);
      const h = handlers[m.method.replace("ui/notifications/", "")];
      if (h) h(m.params || {});
      return;
    }
    const p = pending.get(m.id);
    if (!p) return;
    pending.delete(m.id);
    if (m.error) p.reject(Object.assign(new Error(m.error.message || "error"), { code: m.error.code, data: m.error.data }));
    else p.resolve(m.result);
  });
  return {
    on(name, fn) { handlers[name] = fn; },
    get context() { return ctx; },
    async call(name, args) {
      const r = await request("tools/call", { name, arguments: args || {} });
      if (r && r.isError) throw new Error(((r.content || [])[0] || {}).text || name + " failed");
      return r;
    },
    read: (uri) => request("resources/read", { uri }),
    message: (text) => request("ui/message", { role: "user", content: [{ type: "text", text }] }),
    setContext: (text, structuredContent) => request("ui/update-model-context", { content: [{ type: "text", text }], structuredContent }),
    openLink: (url) => request("ui/open-link", { url }),
    download: (contents) => request("ui/download-file", { contents }),
    displayMode: (mode) => request("ui/request-display-mode", { mode }),
    async start(name, appCapabilities) {
      const r = await request("ui/initialize", { appInfo: { name, version: "1.0.0" }, appCapabilities: appCapabilities || {}, protocolVersion: "2026-01-26" });
      applyContext(r && r.hostContext);
      notify("ui/notifications/initialized", {});
      // the body's own height: the document's scrollHeight never drops below the frame's
      new ResizeObserver(() => notify("ui/notifications/size-changed", {
        width: Math.ceil(document.body.getBoundingClientRect().width), height: Math.ceil(document.body.getBoundingClientRect().height),
      })).observe(document.body);
      return r;
    },
  };
})();
function why(err) {
  const reasons = { "-32031": "this view may not call that tool", "-32032": "the plugin is turned off", "-32033": "you declined it",
    "-32034": "not supported in bise", "-32035": "bise wants a click in the view first, or fewer calls: click again in a moment", "-32036": "the server restarted, try again" };
  return reasons[String(err && err.code)] || (err && err.message) || "it failed";
}

// ---- the board
const $ = (id) => document.getElementById(id);
// every text from a server or an API goes through esc() into innerHTML
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const LIVE_MS = 60000;
let data = null, unit = "c", timer = 0, lastError = "";

const GLYPH = (c) => c === 0 ? "☀︎" : c <= 2 ? "⛅︎" : c === 3 ? "☁︎" : c <= 48 ? "≋" : c <= 67 || (c >= 80 && c <= 82) ? "☂︎" : c <= 86 ? "❄︎" : "ϟ";
const WORD = { 0: "Clear", 1: "Mostly clear", 2: "Partly cloudy", 3: "Overcast", 45: "Fog", 48: "Fog", 51: "Light drizzle", 53: "Drizzle", 55: "Heavy drizzle",
  61: "Light rain", 63: "Rain", 65: "Heavy rain", 66: "Freezing rain", 67: "Freezing rain", 71: "Light snow", 73: "Snow", 75: "Heavy snow", 77: "Snow grains",
  80: "Showers", 81: "Showers", 82: "Violent showers", 85: "Snow showers", 86: "Snow showers", 95: "Thunderstorm", 96: "Thunderstorm, hail", 99: "Thunderstorm, hail" };
const deg = (c) => Math.round(unit === "c" ? c : c * 9 / 5 + 32) + "°";
const dayName = (iso, i) => i === 0 ? "Today" : new Date(iso + "T12:00:00").toLocaleDateString(mcp.context.locale || undefined, { weekday: "short" });
const clock = (d) => d.toLocaleTimeString(mcp.context.locale || undefined, { hour: "2-digit", minute: "2-digit" });

function show(w) {
  data = w;
  $("place").textContent = w.place.name + (w.place.country ? ", " + w.place.country : "");
  draw();
  live();
}

function draw() {
  if (!data) return;
  const c = data.current;
  const W = Math.max(280, $("body").clientWidth || 560), H = 176, top = 22, bottom = 52, pad = W / 14;
  const xs = data.days.map((_, i) => pad + i * (W - 2 * pad) / (data.days.length - 1));
  const all = data.days.flatMap((d) => [d.max, d.min]);
  const lo = Math.min(...all) - 2, hi = Math.max(...all) + 2;
  const y = (t) => top + (hi - t) / (hi - lo) * (H - top - bottom);
  const line = (k) => data.days.map((d, i) => (i ? "L" : "M") + xs[i].toFixed(1) + " " + y(d[k]).toFixed(1)).join(" ");
  const band = line("max") + " " + data.days.map((d, i) => "L" + xs[i].toFixed(1) + " " + y(d.min).toFixed(1)).reverse().join(" ") + " Z";
  const rainTop = H - bottom + 6, rainH = 14;
  let svg = `<svg viewBox="0 0 ${W} ${H + 8}" height="${H + 8}" data-testid="chart" role="img" aria-label="7-day forecast">
    <defs><linearGradient id="band" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--warm)" stop-opacity=".16"/><stop offset="1" stop-color="var(--accent)" stop-opacity=".16"/></linearGradient></defs>
    <path class="band" d="${band}"/>`;
  data.days.forEach((d, i) => { svg += `<line class="grid" x1="${xs[i]}" x2="${xs[i]}" y1="${top - 8}" y2="${H - bottom}"/>`; });
  svg += `<path class="hi" d="${line("max")}"/><path class="lo" d="${line("min")}"/>`;
  data.days.forEach((d, i) => {
    const x = xs[i];
    svg += `<circle class="pt-hi" cx="${x}" cy="${y(d.max)}" r="3"/><circle class="pt-lo" cx="${x}" cy="${y(d.min)}" r="3"/>
      <text class="v" x="${x}" y="${y(d.max) - 8}">${deg(d.max)}</text><text class="v lo-t" x="${x}" y="${y(d.min) + 16}">${deg(d.min)}</text>
      <rect class="rain" x="${x - 9}" y="${rainTop + rainH * (1 - d.rain / 100)}" width="18" height="${Math.max(1, rainH * d.rain / 100)}" rx="2"/>
      <text class="rain-t" x="${x}" y="${rainTop + rainH + 11}">${esc(d.rain)}%</text>
      <text class="ic" x="${x}" y="${H - 1}">${GLYPH(d.code)}</text>
      <text class="day${i === 0 ? " today" : ""}" x="${x}" y="${H + 8}">${dayName(d.date, i)}</text>`;
  });
  svg += "</svg>";
  $("body").innerHTML = `
    <div class="now">
      <span class="glyph">${GLYPH(c.code)}</span>
      <span class="temp" data-testid="now">${deg(c.temp)}</span>
      <span class="cond">${WORD[c.code] || ""}<div class="meta">feels ${deg(c.feels)} · wind ${Math.round(c.wind)}\u00a0km/h · humidity ${esc(c.humidity)}%</div></span>
    </div>${svg}
    ${data.source === "sample" ? `<div class="warn" data-testid="sample">Sample data: Open-Meteo is out of reach (${esc(data.note.replace("offline sample: ", ""))}). Live updates keep trying.</div>` : ""}
    ${lastError ? `<div class="warn err">Live update paused: ${esc(lastError)}</div>` : ""}`;
}

async function refresh() {
  if (!data) return;
  const p = data.place;
  try {
    const r = await mcp.call("refresh_forecast", { latitude: p.latitude, longitude: p.longitude, name: p.name, country: p.country });
    lastError = "";
    show(r.structuredContent);
  } catch (err) { lastError = why(err); draw(); live(); }
}
function live() {
  $("dot").classList.toggle("on", !lastError);
  $("updated").textContent = (lastError ? "paused · " : "live · ") + "updated " + clock(new Date(data.updated));
  clearTimeout(timer);
  timer = setTimeout(refresh, LIVE_MS);
}

$("c").onclick = () => { unit = "c"; $("c").classList.add("on"); $("f").classList.remove("on"); draw(); };
$("f").onclick = () => { unit = "f"; $("f").classList.add("on"); $("c").classList.remove("on"); draw(); };
$("refresh").onclick = refresh;
$("credit").onclick = () => mcp.openLink("https://open-meteo.com/").catch((err) => { lastError = why(err); draw(); });
new ResizeObserver(() => draw()).observe($("body"));

mcp.on("tool-input", (p) => { const a = p.arguments || {}; $("place").textContent = a.place || a.name || "Weather"; });
mcp.on("tool-result", (r) => {
  if (r.isError) { $("body").innerHTML = `<div class="warn err">${esc(((r.content || [])[0] || {}).text || "No forecast.")}</div>`; return; }
  if (r.structuredContent) show(r.structuredContent);
});
mcp.on("tool-cancelled", () => { $("body").innerHTML = '<div class="warn">The forecast was stopped.</div>'; $("updated").textContent = "stopped"; });
mcp.on("context", () => draw());
mcp.on("teardown", () => clearTimeout(timer));
mcp.start("weather-board");
</script>
</body>
</html>
