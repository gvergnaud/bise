<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Palette</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: var(--color-background-primary, light-dark(#ffffff, #1c1c1f));
    --bg2: var(--color-background-secondary, light-dark(#f6f6f5, #242428));
    --fg: var(--color-text-primary, light-dark(#1d1d1f, #ececef));
    --fg2: var(--color-text-secondary, light-dark(#6c6c72, #a1a1aa));
    --fg3: var(--color-text-tertiary, light-dark(#a0a0a6, #6f6f78));
    --line: var(--color-border-primary, light-dark(#e4e4e2, #38383e));
    --danger: var(--color-text-danger, light-dark(#c92a2a, #ff8787));
    --ok: var(--color-text-success, light-dark(#2b8a3e, #69db7c));
    --radius: var(--border-radius-md, 8px);
    --sans: var(--font-sans, -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif);
    --mono: var(--font-mono, ui-monospace, "SF Mono", Menlo, monospace);
  }
  html[data-theme="light"] { color-scheme: light; }
  html[data-theme="dark"] { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.45 var(--sans); color: var(--fg); background: var(--bg); -webkit-font-smoothing: antialiased; }
  .app { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  .head { display: flex; align-items: center; gap: 8px; }
  h1 { margin: 0; font-size: 14px; font-weight: 600; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  button { font: inherit; font-size: 12px; height: 28px; padding: 0 10px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); cursor: pointer; white-space: nowrap; }
  button:hover { background: var(--bg2); }
  .strip { display: flex; height: 26px; border-radius: 6px; overflow: hidden; }
  .strip span { flex: 1; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
  .sw { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; cursor: pointer; background: var(--bg); text-align: left; padding: 0; height: auto; display: block; width: 100%; }
  .sw:hover { background: var(--bg); box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  .chip { height: 72px; display: flex; align-items: flex-end; justify-content: space-between; padding: 6px 8px; font: 600 15px var(--sans); }
  .chip small { font: 500 10px var(--sans); opacity: .85; }
  .meta { padding: 6px 8px 7px; }
  .meta .n { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta .hex { font: 11.5px var(--mono); color: var(--fg2); }
  .meta .copied { color: var(--ok); font-family: var(--sans); }
  .ratios { display: flex; gap: 8px; margin-top: 3px; font-size: 10.5px; color: var(--fg3); font-variant-numeric: tabular-nums; }
  .status { min-height: 16px; color: var(--fg2); font-size: 12px; }
  .status.err { color: var(--danger); }
</style>
</head>
<body>
<div class="app">
  <div class="head">
    <h1 id="name" data-testid="name">Palette</h1>
    <button id="css" data-testid="copy-css" title="Copy the palette as CSS variables">Copy CSS</button>
    <button id="dl" data-testid="download-css">Download .css</button>
  </div>
  <div class="strip" id="strip"></div>
  <div class="grid" id="grid" data-testid="swatches"></div>
  <div class="status" id="status" data-testid="status">Click a swatch to copy its color.</div>
</div>
<script>
// A static Vibe view (ai.mistral.vibe/views/palette): no server. Its tool's
// arguments arrive as ui/notifications/tool-input; it never calls a tool.
const mcp = (() => {
  const pending = new Map(), handlers = {};
  let nextId = 1, ctx = {};
  const post = (m) => window.parent.postMessage({ jsonrpc: "2.0", ...m }, "*");
  const request = (method, params) => new Promise((resolve, reject) => {
    const id = nextId++; pending.set(id, { resolve, reject }); post({ id, method, params });
  });
  const notify = (method, params) => post({ method, params });
  function applyContext(c) {
    if (!c) return;
    ctx = { ...ctx, ...c };
    const root = document.documentElement;
    if (c.theme) root.dataset.theme = c.theme;
    const vars = c.styles && c.styles.variables;
    if (vars) for (const [k, v] of Object.entries(vars)) if (v) root.style.setProperty(k, v);
    if (c.displayMode) root.dataset.mode = c.displayMode;
  }
  window.addEventListener("message", (e) => {
    if (e.source !== window.parent) return;
    const m = e.data;
    if (!m || m.jsonrpc !== "2.0") return;
    if (m.method && m.id !== undefined) {
      if (m.method === "ui/resource-teardown" || m.method === "ping") post({ id: m.id, result: {} });
      else post({ id: m.id, error: { code: -32601, message: "method not found" } });
      return;
    }
    if (m.method) {
      if (m.method === "ui/notifications/host-context-changed") applyContext(m.params);
      const h = handlers[m.method.replace("ui/notifications/", "")];
      if (h) h(m.params || {});
      return;
    }
    const p = pending.get(m.id);
    if (!p) return;
    pending.delete(m.id);
    if (m.error) p.reject(Object.assign(new Error(m.error.message || "error"), { code: m.error.code }));
    else p.resolve(m.result);
  });
  return {
    on(name, fn) { handlers[name] = fn; },
    download: (contents) => request("ui/download-file", { contents }),
    async start(name) {
      const r = await request("ui/initialize", { appInfo: { name, version: "1.0.0" }, appCapabilities: {}, protocolVersion: "2026-01-26" });
      applyContext(r && r.hostContext);
      notify("ui/notifications/initialized", {});
      // the body's own height: the document's scrollHeight never drops below the frame's
      new ResizeObserver(() => notify("ui/notifications/size-changed", {
        width: Math.ceil(document.body.getBoundingClientRect().width), height: Math.ceil(document.body.getBoundingClientRect().height),
      })).observe(document.body);
    },
  };
})();

const $ = (id) => document.getElementById(id);
let palette = { name: "Palette", colors: [] };
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const status = (t, err) => { $("status").textContent = t; $("status").className = "status" + (err ? " err" : ""); };

function hexOf(raw) {
  let h = String(raw || "").trim().replace(/^#/, "").toLowerCase();
  if (/^[0-9a-f]{3}$/.test(h)) h = h.split("").map((c) => c + c).join("");
  return /^[0-9a-f]{6}$/.test(h) ? "#" + h : null;
}
// WCAG 2 relative luminance and contrast ratio
function lum(hex) {
  const ch = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255).map((c) => (c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4));
  return 0.2126 * ch[0] + 0.7152 * ch[1] + 0.0722 * ch[2];
}
const ratio = (a, b) => { const [x, y] = [lum(a), lum(b)].sort((p, q) => q - p); return (x + 0.05) / (y + 0.05); };
const grade = (r) => (r >= 7 ? "AAA" : r >= 4.5 ? "AA" : r >= 3 ? "AA large" : "–");
const slug = (t) => String(t).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

function show(args) {
  const colors = (args.colors || []).map((c, i) => {
    const hex = hexOf(typeof c === "string" ? c : c && c.hex);
    return hex && { hex, name: (typeof c === "object" && c.name) || "Color " + (i + 1) };
  }).filter(Boolean).slice(0, 12);
  palette = { name: String(args.name || "Palette"), colors };
  $("name").textContent = palette.name;
  $("strip").innerHTML = colors.map((c) => `<span style="background:${c.hex}"></span>`).join("");
  $("grid").innerHTML = colors.map((c, i) => {
    const w = ratio(c.hex, "#ffffff"), b = ratio(c.hex, "#000000"), ink = w >= b ? "#fff" : "#000";
    return `<button class="sw" data-i="${i}" title="Copy ${c.hex}">
      <div class="chip" style="background:${c.hex};color:${ink}">Aa<small>${grade(Math.max(w, b))}</small></div>
      <div class="meta"><div class="n">${esc(c.name)}</div><div class="hex" data-hex="${i}">${c.hex.toUpperCase()}</div>
      <div class="ratios"><span title="on white">○ ${w.toFixed(1)}</span><span title="on black">● ${b.toFixed(1)}</span></div></div></button>`;
  }).join("");
  if (!colors.length) status("No valid colors in the input (want #rrggbb).", true);
}
const css = () => `/* ${palette.name} */\n:root {\n` + palette.colors.map((c) => `  --${slug(palette.name) || "palette"}-${slug(c.name) || "color"}: ${c.hex};`).join("\n") + "\n}\n";

// clipboardWrite: declared in view.json, granted when the plugin is added
async function copy(text, what) {
  try { await navigator.clipboard.writeText(text); status("Copied " + what + "."); return true; }
  catch (err) { status("Copy is not allowed for this view (" + err.name + ").", true); return false; }
}
$("grid").onclick = async (e) => {
  const sw = e.target.closest(".sw"); if (!sw) return;
  const c = palette.colors[+sw.dataset.i], el = sw.querySelector("[data-hex]");
  if (await copy(c.hex, c.name + " " + c.hex)) { el.textContent = "Copied"; el.classList.add("copied"); setTimeout(() => { el.textContent = c.hex.toUpperCase(); el.classList.remove("copied"); }, 1200); }
};
$("css").onclick = () => copy(css(), "the CSS variables");
$("dl").onclick = async () => {
  try { await mcp.download([{ type: "resource", resource: { uri: "file:///" + (slug(palette.name) || "palette") + ".css", mimeType: "text/css", text: css() } }]); status("Downloaded."); }
  catch (err) { status("Download: " + (err.message || "refused"), true); }
};

mcp.on("tool-input", (p) => show(p.arguments || {}));
mcp.start("color-palette");
</script>
</body>
</html>
