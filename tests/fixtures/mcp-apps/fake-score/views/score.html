<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>score</title>
<style>
  body { margin: 0; padding: 12px; font: 13px/1.4 var(--font-sans, system-ui);
         color: var(--color-text-primary, CanvasText); background: var(--color-background-primary, Canvas); }
  #notes span { display: inline-block; min-width: 34px; padding: 4px; margin: 2px; text-align: center;
                border: 1px solid var(--color-border-primary, GrayText); border-radius: 4px; cursor: pointer; }
  #log { color: var(--color-text-secondary, GrayText); white-space: pre-wrap; }
</style>
</head>
<body>
<div id="title" data-testid="title">no score yet</div>
<div id="notes" data-testid="notes"></div>
<button id="reverse" data-testid="reverse">reverse</button>
<button id="export" data-testid="export">export</button>
<button id="extra" data-testid="extra">ask mistral/complete</button>
<div id="log" data-testid="log"></div>
<script>
// fake-score's view: draws the score from the tool result's
// structuredContent, edits it with the app-only set_notes, exports a file.
const $ = (id) => document.getElementById(id);
const pending = new Map();
let nextId = 1, notes = [];
const log = (t) => { $("log").textContent += t + "\n"; };
function request(method, params) {
  const id = nextId++;
  window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
  return new Promise((resolve, reject) => pending.set(id, { resolve, reject }));
}
function draw(r) {
  const s = r && r.structuredContent;
  if (!s) return;
  notes = s.notes || [];
  $("title").textContent = s.title + " · " + s.key + " · " + s.bpm + " bpm";
  $("notes").innerHTML = "";
  for (const n of notes) { const el = document.createElement("span"); el.textContent = n; $("notes").appendChild(el); }
}
window.addEventListener("message", (e) => {
  if (e.source !== window.parent) return;
  const m = e.data || {};
  if (m.id !== undefined && !m.method) {
    const p = pending.get(m.id); if (!p) return; pending.delete(m.id);
    m.error ? p.reject(m.error) : p.resolve(m.result); return;
  }
  if (m.method === "ui/notifications/tool-result") draw(m.params);
});
$("reverse").onclick = async () => {
  try { draw(await request("tools/call", { name: "set_notes", arguments: { notes: [...notes].reverse() } })); }
  catch (err) { log("edit refused: " + err.message); }
};
$("export").onclick = async () => {
  try {
    const r = await request("tools/call", { name: "export", arguments: {} });
    await request("ui/download-file", { contents: r.content });
    log("exported");
  } catch (err) { log("export refused: " + err.message); }
};
$("extra").onclick = async () => {
  try { await request("tools/call", { name: "mistral/complete", arguments: { prompt: "a title" } }); log("extra ran"); }
  catch (err) { log("extra refused: " + err.message); }
};
request("ui/initialize", {
  appInfo: { name: "fake-score", version: "0.1.0" }, appCapabilities: {}, protocolVersion: "2026-01-26",
}).then(() => window.parent.postMessage({ jsonrpc: "2.0", method: "ui/notifications/initialized" }, "*"));
</script>
</body>
</html>
