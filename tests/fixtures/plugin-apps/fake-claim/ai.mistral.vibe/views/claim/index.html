<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>claim</title>
</head>
<body>
<p id="name" data-testid="name">waiting for the file…</p>
<script>
// fake-claim's opener (docs/plugin-apps.md, Fixtures): shows the name of
// the file it was opened with, so a test sees which app opened it.
window.addEventListener("message", (e) => {
  if (e.source !== window.parent) return;
  const m = e.data || {};
  if (m.method === "ui/notifications/tool-input") {
    const file = (m.params.arguments || {}).file || {};
    document.getElementById("name").textContent = "claim: " + (file.name || "?");
  }
  if (m.id === 1 && m.result) window.parent.postMessage({ jsonrpc: "2.0", method: "ui/notifications/initialized" }, "*");
});
window.parent.postMessage({ jsonrpc: "2.0", id: 1, method: "ui/initialize", params: {
  appInfo: { name: "fake-claim claim", version: "0.1.0" }, appCapabilities: {}, protocolVersion: "2026-01-26",
} }, "*");
</script>
</body>
</html>
