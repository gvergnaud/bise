<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>fake2</title>
</head>
<body>
<p id="name" data-testid="name">waiting for the file…</p>
<pre id="text" data-testid="text"></pre>
<script>
// fake-opener's server view (ui://fake-opener/fake2): shows the file's
// name and its text, read through the handle (docs/plugin-apps.md A4).
const pending = new Map();
let nextId = 1;
function request(method, params) {
  const id = nextId++;
  window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
  return new Promise((resolve, reject) => pending.set(id, { resolve, reject }));
}
window.addEventListener("message", (e) => {
  if (e.source !== window.parent) return;
  const m = e.data || {};
  if (m.method === "ui/notifications/tool-input") {
    const file = (m.params.arguments || {}).file;
    if (!file) return;
    document.getElementById("name").textContent = file.name;
    request("resources/read", { uri: file.resourceUri }).then((r) => {
      const c = (r.contents || [])[0] || {};
      document.getElementById("text").textContent = c.text !== undefined ? c.text : "(" + (c.blob || "").length + " base64 chars)";
    }, (err) => { document.getElementById("text").textContent = "error " + JSON.stringify(err).slice(0, 120); });
    return;
  }
  const p = m.id !== undefined && !m.method && pending.get(m.id);
  if (!p) return;
  pending.delete(m.id);
  m.error ? p.reject(m.error) : p.resolve(m.result);
});
request("ui/initialize", { appInfo: { name: "fake-opener fake2", version: "0.1.0" }, appCapabilities: {}, protocolVersion: "2026-01-26" })
  .then(() => window.parent.postMessage({ jsonrpc: "2.0", method: "ui/notifications/initialized" }, "*"));
</script>
</body>
</html>
