# BISE-168: build the installable archive on both Mac arches and both
# Linux arches (linux-nix), install it
# in a clean fake HOME and run it (packaging/test-install.sh), and on a
# v* tag publish a DRAFT GitHub Release (BISE-220: CI is the one
# publisher; packaging/ci-release.sh): both archives + .sha256,
# latest.json and the stamped install.sh, the files install.sh and
# `bise update` read. The user publishes the draft (publish-release.sh
# <tag> --publish). Same build path as /version on a dev Mac:
# build-dist.sh -> versions.sh -> bins.sh.
#
# Signing: ad-hoc only (build-dist.sh; user decision, no Developer ID):
# files fetched by curl or brew carry no quarantine flag, so Gatekeeper
# lets them run. BISE-169 adds Developer ID + notarization later.
#
# Triggers: a v* tag (build + draft release) and the Actions tab (build
# only). Not every push to main: macOS minutes cost 10x on a private
# repo and a cold build is long (the V8 engine); add `branches: [main]`
# under `push` to build each push.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # THE command name (BISE-165): what test-install.sh installs and runs
  # (bend-harness is its old-name link, one release)
  BISE_CMD: bise
  # pinned Bend: the release archive and its sha256 per arch (the values
  # of https://bend-lang.com/install.sh for this version)
  BEND_VERSION: "2.0.35"
  BEND_SHA256_ARM64: 2582f25057a519c330e6875798b784b727d4201f1c1f6944a105348f0eb8972e
  BEND_SHA256_X64: 7e59da4513e32ea7526464b342344a992a56372cdf62e0c55a30e9ce26baaeef
  # the linux archives of the same Bend (docs/ports-plan.md)
  BEND_SHA256_LINUX_ARM64: 09b813073241628f590f2c2fe420299ec25e4dddd6cf3fdc49c9486339989564
  BEND_SHA256_LINUX_X64: 63039d1a119f716767ac5a7d8fe0717cfacf219c6c253c35192148e0dade722f
  RUST_VERSION: "1.97.1"
  CARGO_TERM_COLOR: never
  # bend asks bend-lang.com for a newer version once a day: not on CI
  BEND_NO_TELEMETRY: "1"
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
            bend_arch: arm64
          - target: darwin-x86_64
            runner: macos-15-intel
            bend_arch: x64
          # Linux (docs/ports-plan.md): built on Ubuntu 22.04, so every
          # binary needs glibc 2.34 at most (the floor). NixOS takes the
          # same archives through the flake (nix/package.nix patches them)
          - target: linux-x86_64
            runner: ubuntu-22.04
            bend_arch: x64
          - target: linux-arm64
            runner: ubuntu-22.04-arm
            bend_arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Environment
        run: |
          # the build dirs of versions.sh / bins.sh (cached below), out of ~/.bise
          {
            echo "SB_BUILD_DIR=$HOME/sb-build"
            echo "SB_VERSIONS_DIR=$HOME/sb-versions"
            echo "BISE_CHANNEL=${{ startsWith(github.ref, 'refs/tags/v') && 'stable' || 'dev' }}"
          } >> "$GITHUB_ENV"
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
          uname -a; sw_vers 2>/dev/null || { cat /etc/os-release; ldd --version | head -n 1; }

      # Linux: clang >= 15 (Ubuntu 22.04's clang 14 crashes on sb-core on
      # arm64), zsh (test-install.sh's shell). bend -o calls `clang`.
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends clang-15 zsh
          mkdir -p "$HOME/.local/clang/bin"
          ln -sf /usr/bin/clang-15 "$HOME/.local/clang/bin/clang"
          echo "$HOME/.local/clang/bin" >> "$GITHUB_PATH"

      - name: Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustc --version

      - name: Restore Bend ${{ env.BEND_VERSION }}
        id: bend-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.bend/bin
            ~/.bend/bend2
            ~/.bend/guide
          key: bend-${{ env.BEND_VERSION }}-${{ matrix.target }}

      - name: Install Bend ${{ env.BEND_VERSION }} (pinned, sha256 checked)
        if: steps.bend-cache.outputs.cache-hit != 'true'
        env:
          BEND_ARCH: ${{ matrix.bend_arch }}
        run: |
          case "${{ runner.os }}-$BEND_ARCH" in
            macOS-arm64) os=darwin sum="$BEND_SHA256_ARM64" ;;
            macOS-x64) os=darwin sum="$BEND_SHA256_X64" ;;
            Linux-arm64) os=linux sum="$BEND_SHA256_LINUX_ARM64" ;;
            Linux-x64) os=linux sum="$BEND_SHA256_LINUX_X64" ;;
          esac
          name="bend-$BEND_VERSION-$os-$BEND_ARCH.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/$name" \
            "https://github.com/bendlang/bend/releases/download/v$BEND_VERSION/$name"
          echo "$sum  $RUNNER_TEMP/$name" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/$name" -C "$RUNNER_TEMP"
          mkdir -p ~/.bend/bin
          rm -rf ~/.bend/bend2 ~/.bend/guide
          mv "$RUNNER_TEMP/bend/bend2" "$RUNNER_TEMP/bend/guide" ~/.bend/
          mv -f "$RUNNER_TEMP/bend/bin/bend" ~/.bend/bin/bend

      - name: Check Bend
        run: bend version | grep -F "$BEND_VERSION"

      # cargo: the registry + the release target of versions.sh (it builds
      # a commit in a worktree, into $SB_BUILD_DIR/target-commits)
      - name: Restore cargo
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/sb-build/target-commits
          key: cargo-${{ matrix.target }}-${{ env.RUST_VERSION }}-${{ hashFiles('rust/Cargo.lock', 'rust/.cargo/config.toml') }}
          restore-keys: cargo-${{ matrix.target }}-${{ env.RUST_VERSION }}-

      # the V8 engine (rust/jsrt): the long build, rarely changed
      - name: Restore jsrt
        id: jsrt-cache
        uses: actions/cache/restore@v4
        with:
          path: rust/jsrt/target
          key: jsrt-${{ matrix.target }}-${{ env.RUST_VERSION }}-${{ hashFiles('rust/jsrt/Cargo.lock', 'rust/jsrt/Cargo.toml', 'rust/jsrt/src/**', 'rust/.cargo/config.toml') }}
          restore-keys: jsrt-${{ matrix.target }}-${{ env.RUST_VERSION }}-

      # bins.sh's cache: one Bend binary per content hash of its sources
      # (+ the macOS target); the Bend version is in this key, not in
      # bins.sh's. ~/.bend/lib: the packages the compiles fetched.
      - name: Restore Bend binaries
        id: bins-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/sb-build/cache
            ~/.bend/lib
          key: bins-${{ matrix.target }}-bend${{ env.BEND_VERSION }}-${{ hashFiles('bend/runtime/**/*.bend', 'bend/core/**/*.bend', 'bend/vendor/**', 'bend/hub/**/*.bend', 'rust/.cargo/config.toml') }}
          restore-keys: bins-${{ matrix.target }}-bend${{ env.BEND_VERSION }}-

      - name: Build the V8 engine (release)
        run: |
          (cd rust/jsrt && CARGO_TARGET_DIR=target cargo build --release --locked)
          # versions.sh links the engine from target/debug (the dev path);
          # build-dist.sh ships the release one: give versions.sh that one
          # too instead of a second (debug) V8 build
          mkdir -p rust/jsrt/target/debug
          ln -f rust/jsrt/target/release/bend-jsrt rust/jsrt/target/debug/bend-jsrt

      - name: build-dist.sh
        id: dist
        run: |
          tarball="$(packaging/build-dist.sh HEAD --out "$RUNNER_TEMP/dist")"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          ls -la "$RUNNER_TEMP/dist"
          cat "$tarball.sha256"

      - name: test-install.sh
        run: packaging/test-install.sh "${{ steps.dist.outputs.tarball }}"

      - name: Upload the archive
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/dist/*.tar.gz
            ${{ runner.temp }}/dist/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

      # saved even when a later step failed: the next run starts warm
      - name: Save cargo
        if: always() && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/sb-build/target-commits
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

      - name: Save jsrt
        if: always() && steps.jsrt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: rust/jsrt/target
          key: ${{ steps.jsrt-cache.outputs.cache-primary-key }}

      - name: Save Bend binaries
        if: always() && steps.bins-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/sb-build/cache
            ~/.bend/lib
          key: ${{ steps.bins-cache.outputs.cache-primary-key }}

  # CI is the one publisher (BISE-220): make-release.sh lays out the
  # release from both archives (install.sh stamped with the channel,
  # latest.json, the tarballs + .sha256: the files install.sh and
  # `bise update` read), check-release.py checks it, and it goes to a
  # DRAFT release of the tag. A draft is not the latest release: nothing
  # reads it until the user publishes it (publish-release.sh <tag>
  # --publish, or gh release edit <tag> --draft=false). A published
  # release is never rewritten (a rerun only replaces a draft's files).
  release:
    name: draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: ${{ runner.temp }}/dist

      - name: Draft release (make-release.sh, check-release.py)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          CHANNEL: ${{ github.server_url }}/${{ github.repository }}/releases/latest/download
        run: |
          packaging/ci-release.sh "$TAG" "$RUNNER_TEMP/dist" "$RUNNER_TEMP/release" \
            --repo "$GITHUB_REPOSITORY" --url "$CHANNEL" --commit "$GITHUB_SHA" --draft
