# BISE-168: build the installable archive on both Mac arches and both
# Linux arches (linux-nix), install it
# in a clean fake HOME and run it (packaging/test-install.sh), and on a
# v* tag publish a DRAFT GitHub Release (BISE-220: CI is the one
# publisher; packaging/ci-release.sh): both archives + .sha256,
# latest.json and the stamped install.sh, the files install.sh and
# `bise update` read. The user publishes the draft (publish-release.sh
# <tag> --publish). Same build path as /version on a dev Mac:
# build-dist.sh -> versions.sh -> bins.sh.
#
# Signing (cli-sign, docs/packaging.md §6): the darwin jobs sign with his
# Developer ID (the desktop's: environment desktop-release, his approval on
# each run; .github/actions/mac-signing), hardened, notarized, bise.app
# stapled (scripts/dist_sign.py from build-dist.sh), when
#   - a v* tag and the repository variable RELEASE_SIGN is 'on': required,
#     a missing secret fails the job (a tag never ships ad hoc quietly);
#   - Actions > release > Run workflow with 'sign' checked: the signed dry
#     run (build + sign + notarize, the archives as run artifacts, no
#     release; on main or a tag: the environment allows only those).
# Else ad hoc, as before (a fork, a dispatch without 'sign', and a tag
# while RELEASE_SIGN is off: a warning says so). Linux jobs never sign.
#
# Triggers: a v* tag (build + draft release), the Actions tab (build
# only), and the warming runs on main: a push that changes what the
# archive is built from (darwin-arm64 + linux, no artifact) and a nightly
# run (all 4).
#
# Speed (fast-release, ci-release-yml):
#   - darwin-x86_64 is off the desktop's path: the draft needs
#     darwin-arm64 + linux only (the desktop reads darwin-arm64); the
#     Intel job (build-x86, ~2x slower) joins the release when done
#     (ci-release.sh --attach: its archive, then latest.json with the 4
#     targets). The run ends after it: publish-release.sh's watch still
#     sees the 4 targets.
#   - caches are saved on main only: a tag's caches are scoped to its
#     tag (no other ref reads them) and evicted main's under the 10 GB
#     limit, so tags restore main's and save nothing; the warming runs
#     keep main's warm.
#   - the V8 engine is built by bins.sh alone (bend-jsrt, in
#     ~/sb-build/target-jsrt: cached, restored only when bins.sh's cache
#     lacks this engine).
name: release

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - "rust/**"
      - "bend/**"
      - "packaging/**"
      - "scripts/bins.sh"
      - "scripts/versions.sh"
      - "scripts/dist_sign.py"
      - ".github/workflows/release.yml"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      sign:
        description: "darwin: sign with the Developer ID and notarize (his approval: environment desktop-release)"
        type: boolean
        default: false

permissions:
  contents: read

# main's runs queue (one runs, the newest waits) so a warming run ends
# and saves; another branch's dispatch replaces its older run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && github.ref != 'refs/heads/main' }}

env:
  # THE command name (BISE-165): what test-install.sh installs and runs
  BISE_CMD: bise
  # pinned Bend: its version is bend/VERSION (read by the build job's
  # first step); here the sha256 of its release archive per arch (the
  # release notes of that version: change them with bend/VERSION)
  BEND_SHA256_ARM64: d4aaef68de545727429ce83b9e88ff3273bf068df599e3542e446755b5f3d83a
  BEND_SHA256_X64: a512cfd1d29ec24c640126a6a640e597b4ea1abe0aefbda7cc57efd85ab56e22
  # the linux archives of the same Bend (docs/ports-plan.md)
  BEND_SHA256_LINUX_ARM64: 71b43e1bb9313dd14ac2b0553b854e41c39d65ecaa47040796ebff4a46f54a97
  BEND_SHA256_LINUX_X64: 6cf462fd8f70b094a4950ebb709a9c4ffd8f1d1189d9cedf1fd63cd5d041c7ab
  RUST_VERSION: "1.97.1"
  CARGO_TERM_COLOR: never
  # bend asks bend-lang.com for a newer version once a day: not on CI
  BEND_NO_TELEMETRY: "1"
  CARGO_INCREMENTAL: "0"

jobs:
  # the draft's targets; build-x86 below runs the same steps (a YAML
  # anchor) for darwin-x86_64
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            os: darwin
            runner: macos-15
            bend_arch: arm64
          # Linux (docs/ports-plan.md): built on Ubuntu 22.04, so every
          # binary needs glibc 2.34 at most (the floor). NixOS takes the
          # same archives through the flake (nix/package.nix patches them)
          - target: linux-x86_64
            os: linux
            runner: ubuntu-22.04
            bend_arch: x64
          - target: linux-arm64
            os: linux
            runner: ubuntu-22.04-arm
            bend_arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    # the Developer ID's secrets only for a signed darwin build (see the top)
    environment: &sign-environment ${{ (matrix.os == 'darwin' && (inputs.sign || (startsWith(github.ref, 'refs/tags/v') && vars.RELEASE_SIGN == 'on'))) && 'desktop-release' || '' }}
    env: &build-env
      SIGN: ${{ (matrix.os == 'darwin' && (inputs.sign || (startsWith(github.ref, 'refs/tags/v') && vars.RELEASE_SIGN == 'on'))) && '1' || '0' }}
      # the caches are written by main's runs only (see the top)
      SAVE_CACHES: ${{ github.ref == 'refs/heads/main' && '1' || '0' }}
      # a push to main warms the caches: no archive kept
      KEEP_ARCHIVE: ${{ github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') }}
    steps: &build-steps
      - uses: actions/checkout@v4

      # the Bend the tree pins: bend/VERSION is its one owner (bins.sh and
      # the gate read it too, scripts/bend-pin.sh); every step below and
      # the cache keys take it from here
      - name: Bend version (bend/VERSION)
        run: echo "BEND_VERSION=$(tr -d ' \t\r\n' < bend/VERSION)" >> "$GITHUB_ENV"

      - name: Environment
        run: |
          # the build dirs of versions.sh / bins.sh (cached below), out of ~/.bise
          {
            echo "SB_BUILD_DIR=$HOME/sb-build"
            echo "SB_VERSIONS_DIR=$HOME/sb-versions"
            echo "BISE_CHANNEL=${{ startsWith(github.ref, 'refs/tags/v') && 'stable' || 'dev' }}"
          } >> "$GITHUB_ENV"
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
          uname -a; sw_vers 2>/dev/null || { cat /etc/os-release; ldd --version | head -n 1; }

      # the xlsx grid (office/dist/office-sheet.js, never committed): versions.sh
      # has bins.sh build it with pnpm and node (office/sdk's lockfile)
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: office/sdk/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Linux: clang >= 15 (Ubuntu 22.04's clang 14 crashes on sb-core on
      # arm64), zsh (test-install.sh's shell). bend -o calls `clang`.
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends clang-15 zsh
          mkdir -p "$HOME/.local/clang/bin"
          ln -sf /usr/bin/clang-15 "$HOME/.local/clang/bin/clang"
          echo "$HOME/.local/clang/bin" >> "$GITHUB_PATH"

      - name: Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustc --version

      - name: Restore Bend ${{ env.BEND_VERSION }}
        id: bend-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.bend/bin
            ~/.bend/bend2
            ~/.bend/guide
          key: bend-${{ env.BEND_VERSION }}-${{ matrix.target }}

      - name: Install Bend ${{ env.BEND_VERSION }} (pinned, sha256 checked)
        if: steps.bend-cache.outputs.cache-hit != 'true'
        env:
          BEND_ARCH: ${{ matrix.bend_arch }}
        run: |
          case "${{ runner.os }}-$BEND_ARCH" in
            macOS-arm64) os=darwin sum="$BEND_SHA256_ARM64" ;;
            macOS-x64) os=darwin sum="$BEND_SHA256_X64" ;;
            Linux-arm64) os=linux sum="$BEND_SHA256_LINUX_ARM64" ;;
            Linux-x64) os=linux sum="$BEND_SHA256_LINUX_X64" ;;
          esac
          name="bend-$BEND_VERSION-$os-$BEND_ARCH.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/$name" \
            "https://github.com/bendlang/bend/releases/download/v$BEND_VERSION/$name"
          echo "$sum  $RUNNER_TEMP/$name" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/$name" -C "$RUNNER_TEMP"
          mkdir -p ~/.bend/bin
          rm -rf ~/.bend/bend2 ~/.bend/guide
          mv "$RUNNER_TEMP/bend/bend2" "$RUNNER_TEMP/bend/guide" ~/.bend/
          mv -f "$RUNNER_TEMP/bend/bin/bend" ~/.bend/bin/bend

      - name: Check Bend
        run: bend version | grep -F "$BEND_VERSION"

      # cargo: the registry + the release target of versions.sh (it builds
      # a commit in a worktree, into $SB_BUILD_DIR/target-commits, with
      # scripts/cargo_mtimes.py's manifest of the sources it was built from:
      # unchanged crates are not rebuilt). The key has the Rust sources'
      # hash: a main run with new Rust saves its target and manifest (with
      # the Cargo.lock hash alone the key never changed, the save was
      # skipped and the manifest never reached the cache: run 39021507942)
      - name: Restore cargo
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/sb-build/target-commits
          key: cargo-${{ matrix.target }}-${{ env.RUST_VERSION }}-${{ hashFiles('rust/Cargo.lock', 'rust/.cargo/config.toml') }}-${{ hashFiles('rust/**/*.rs', 'rust/**/Cargo.toml') }}
          restore-keys: |
            cargo-${{ matrix.target }}-${{ env.RUST_VERSION }}-${{ hashFiles('rust/Cargo.lock', 'rust/.cargo/config.toml') }}-
            cargo-${{ matrix.target }}-${{ env.RUST_VERSION }}-

      # bins.sh's cache: one Bend binary per content hash of its sources
      # (+ the macOS target); the Bend version is in this key, not in
      # bins.sh's. ~/.bend/lib: the packages the compiles fetched. The
      # engine's crates are in the key too: a new bend-jsrt is saved.
      - name: Restore Bend binaries
        id: bins-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/sb-build/cache
            ~/.bend/lib
          key: bins-${{ matrix.target }}-bend${{ env.BEND_VERSION }}-${{ hashFiles('bend/runtime/**/*.bend', 'bend/core/**/*.bend', 'bend/vendor/**', 'bend/hub/**/*.bend', 'rust/.cargo/config.toml', 'rust/jsrt/**', 'rust/images/**', 'rust/home/**') }}
          restore-keys: bins-${{ matrix.target }}-bend${{ env.BEND_VERSION }}-

      # the V8 engine: bins.sh builds bend-jsrt (versions.sh takes it from
      # bins.sh's cache) in ~/sb-build/target-jsrt. Its dependencies (V8)
      # are the long part: that target dir is restored only when bins.sh's
      # cache lacks this engine (its key: the crates' files, bins.sh key)
      - name: Is the engine built?
        id: engine
        run: |
          k="$(scripts/bins.sh key bend-jsrt)"
          if [ -f "$SB_BUILD_DIR/cache/bend-jsrt-$k" ]; then echo "built=true" >> "$GITHUB_OUTPUT"; else echo "built=false" >> "$GITHUB_OUTPUT"; fi
          echo "bend-jsrt-$k: $(test -f "$SB_BUILD_DIR/cache/bend-jsrt-$k" && echo in the cache || echo to build)"

      - name: Restore the engine's target
        id: jsrt-cache
        if: steps.engine.outputs.built != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ~/sb-build/target-jsrt
          key: jsrt-target-${{ matrix.target }}-${{ env.RUST_VERSION }}-${{ hashFiles('rust/jsrt/Cargo.lock', 'rust/.cargo/config.toml') }}
          restore-keys: jsrt-target-${{ matrix.target }}-${{ env.RUST_VERSION }}-

      - name: The signing keychain
        if: ${{ env.SIGN == '1' }}
        uses: ./.github/actions/mac-signing
        with:
          cert-p12-base64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          cert-password: ${{ secrets.MAC_CERT_PASSWORD }}
          api-key-p8: ${{ secrets.APPLE_API_KEY_P8 }}
          team-id: ${{ secrets.APPLE_TEAM_ID }}

      - name: A tag, unsigned
        if: ${{ matrix.os == 'darwin' && env.SIGN != '1' && startsWith(github.ref, 'refs/tags/v') }}
        run: |
          echo "::warning::RELEASE_SIGN is not 'on': this tag's darwin archive is ad hoc signed (its folder grants won't last across updates)"

      - name: build-dist.sh${{ env.SIGN == '1' && ' (Developer ID, notarized)' || '' }}
        id: dist
        env:
          APPLE_API_KEY_ID: ${{ env.SIGN == '1' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ env.SIGN == '1' && secrets.APPLE_API_ISSUER || '' }}
        run: |
          if [ "$SIGN" = 1 ]; then
            export BISE_SIGN_ID="$SIGN_ID" BISE_SIGN_KEYCHAIN="$SIGN_KEYCHAIN" BISE_NOTARIZE=1 BISE_SIGN_REQUIRED=1
          fi
          tarball="$(packaging/build-dist.sh HEAD --out "$RUNNER_TEMP/dist")"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          ls -la "$RUNNER_TEMP/dist"
          cat "$tarball.sha256"

      - name: test-install.sh
        run: packaging/test-install.sh "${{ steps.dist.outputs.tarball }}"

      - name: Upload the archive
        if: env.KEEP_ARCHIVE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/dist/*.tar.gz
            ${{ runner.temp }}/dist/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Forget the keychain and the key
        if: ${{ always() && env.SIGN == '1' }}
        run: |
          if [ -n "${SIGN_KEYCHAIN:-}" ]; then security delete-keychain "$SIGN_KEYCHAIN" || true; fi
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/cert.p12"

      # main only (tags restore main's: see the top); saved even when a
      # later step failed, never from a cancelled run (half a build)
      - name: Save Bend ${{ env.BEND_VERSION }}
        if: "!cancelled() && env.SAVE_CACHES == '1' && steps.bend-cache.outputs.cache-hit != 'true'"
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.bend/bin
            ~/.bend/bend2
            ~/.bend/guide
          key: ${{ steps.bend-cache.outputs.cache-primary-key }}

      - name: Save cargo
        if: "!cancelled() && env.SAVE_CACHES == '1' && steps.cargo-cache.outputs.cache-hit != 'true'"
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/sb-build/target-commits
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

      # only when bins.sh built the engine here (its target dir exists)
      - name: Did bins.sh build the engine?
        id: engine-built
        if: "!cancelled() && steps.engine.outputs.built != 'true'"
        run: if [ -d "$SB_BUILD_DIR/target-jsrt/release" ]; then echo "here=true" >> "$GITHUB_OUTPUT"; fi

      - name: Save the engine's target
        if: "!cancelled() && env.SAVE_CACHES == '1' && steps.engine-built.outputs.here == 'true' && steps.jsrt-cache.outputs.cache-hit != 'true'"
        uses: actions/cache/save@v4
        with:
          path: ~/sb-build/target-jsrt
          key: ${{ steps.jsrt-cache.outputs.cache-primary-key }}

      - name: Save Bend binaries
        if: "!cancelled() && env.SAVE_CACHES == '1' && steps.bins-cache.outputs.cache-hit != 'true'"
        uses: actions/cache/save@v4
        with:
          path: |
            ~/sb-build/cache
            ~/.bend/lib
          key: ${{ steps.bins-cache.outputs.cache-primary-key }}

  # CI is the one publisher (BISE-220): make-release.sh lays out the
  # release from both archives (install.sh stamped with the channel,
  # latest.json, the tarballs + .sha256: the files install.sh and
  # `bise update` read), check-release.py checks it, and it goes to a
  # DRAFT release of the tag. A draft is not the latest release: nothing
  # reads it until the user publishes it (publish-release.sh <tag>
  # --publish, or gh release edit <tag> --draft=false). A published
  # release is never rewritten (a rerun only replaces a draft's files).
  #
  # The draft has darwin-arm64 + linux (what the desktop and most users
  # read): it does not wait for the Intel job.
  release:
    name: draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: ${{ runner.temp }}/dist

      - name: Draft release (make-release.sh, check-release.py)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          CHANNEL: ${{ github.server_url }}/${{ github.repository }}/releases/latest/download
        run: |
          # build-x86 may have uploaded already: the draft is the 3 targets
          rm -f "$RUNNER_TEMP"/dist/*-darwin-x86_64.tar.gz "$RUNNER_TEMP"/dist/*-darwin-x86_64.tar.gz.sha256
          packaging/ci-release.sh "$TAG" "$RUNNER_TEMP/dist" "$RUNNER_TEMP/release" \
            --repo "$GITHUB_REPOSITORY" --url "$CHANNEL" --commit "$GITHUB_SHA" --draft \
            --targets "darwin-arm64 linux-x86_64 linux-arm64"

  # darwin-x86_64: the same steps as build (the anchors), on the Intel
  # runner (~2x slower), off the draft's path. Not on a push to main (the
  # warming run): the nightly run keeps its caches warm.
  build-x86:
    # spelled out: a skipped job (a push to main) shows its name unexpanded
    name: build darwin-x86_64
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
    strategy:
      matrix:
        include:
          - target: darwin-x86_64
            os: darwin
            runner: macos-15-intel
            bend_arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    environment: *sign-environment
    env: *build-env
    steps: *build-steps

  # the Intel archive joins the tag's release (a draft, or published
  # already: additive, the notes kept), latest.json then names the 4
  # targets (ci-release.sh --attach, checked with every target)
  attach-x86:
    name: attach darwin-x86_64
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-x86, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: ${{ runner.temp }}/dist

      - name: Attach darwin-x86_64 (ci-release.sh --attach)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          CHANNEL: ${{ github.server_url }}/${{ github.repository }}/releases/latest/download
        run: |
          packaging/ci-release.sh "$TAG" "$RUNNER_TEMP/dist" "$RUNNER_TEMP/release" \
            --repo "$GITHUB_REPOSITORY" --url "$CHANNEL" --commit "$GITHUB_SHA" --attach darwin-x86_64
