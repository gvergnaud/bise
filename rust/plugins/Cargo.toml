[package]
name = "bend-plugins"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Agent Plugins 1.0 for the Bend harness: resolver, diagnostics, stdio MCP bridge."

[dependencies]
bise-home = { path = "../home" }
# where auth.json and the MCP logins live: files or the macOS keychain
bise-secrets = { path = "../secrets" }
serde_json = "1"
# kill(2) for the parent watch (src/bridge.rs Parent)
libc = "0.2"
# remote MCP servers (src/http.rs): the TUI's TLS stack, already in the lock
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"
# OAuth for remote MCP servers (src/oauth.rs): PKCE's SHA-256 and random
# bytes, base64url; both already in the lock
ring = "0.17"
base64 = "0.22"
