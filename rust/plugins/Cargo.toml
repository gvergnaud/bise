[package]
name = "bend-plugins"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Agent Plugins 1.0 for the Bend harness: resolver, diagnostics, stdio MCP bridge."

[dependencies]
bise-home = { path = "../home" }
serde_json = "1"
# remote MCP servers (src/http.rs): the TUI's TLS stack, already in the lock
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"
