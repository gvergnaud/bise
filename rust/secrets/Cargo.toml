[package]
name = "bise-secrets"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Where bise's secrets live: their files, or the macOS keychain through /usr/bin/security (option A of page secrets-keychain)."

[dependencies]
bise-home = { path = "../home" }
# the stored payload (printable, so `security -w` prints it as it is)
base64 = "0.22"
# config.toml's [secrets] store
toml = "1"
