[package]
name = "switchboard"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Switchboard: one main agent that routes to task sub-agents (hub, agent CLI, client protocol)."

[dependencies]
bend-plugins = { path = "../plugins" }
bise-catalog = { path = "../catalog" }
bise-home = { path = "../home" }
bise-session = { path = "../session" }
# `sb every day 07:30`: local time (localtime_r/mktime)
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
brush-parser = "=0.4.0"
