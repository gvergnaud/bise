[package]
name = "bend-tui"
version = "1.0.0"
edition = "2021"
license.workspace = true
description = "Ratatui terminal UI for the Bend Unified Harness (Rust port of repl-tui)."

[dependencies]
bise-home = { path = "../home" }
# the typed client protocol (bise desktop S3a/S3b): the ambient core's
# projects rows (ambient/projects.rs) and the agents view's typed threads
bise-proto = { path = "../proto" }
# /log (logview.rs): the agent's session log, read-only
bise-session = { path = "../session" }
bise-catalog = { path = "../catalog" }
bend-plugins = { path = "../plugins" }
bend-images = { path = "../images" }
ratatui = "0.29"
# the embedded terminal (term.rs): a PTY, a vt100 parser, its ratatui widget
tui-term = "0.2"
vt100 = "0.15"
portable-pty = "0.9"
crossterm = "0.28"
unicode-width = "0.2"
unicode-segmentation = "1"
serde_json = "1"
# speech-to-text (voice.rs): one HTTPS request per clip; the microphone
# (cpal) below
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"
# voice mode (voicemode/): the realtime speech-to-text websocket, the
# TTS stream's base64 PCM chunks
tungstenite = { version = "0.24", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
base64 = "0.22"
ignore = "0.4"
nucleo-matcher = "0.3.1"
memchr = "2.8.3"

# the microphone (voice.rs): CoreAudio on macOS, WASAPI on Windows. Not
# on Linux: cpal links ALSA (libasound.so.2), a library a server or a
# container does not have, and bise would not start without it (ports-
# plan.md). Linux voice: a dlopen'd backend later.
[target.'cfg(not(target_os = "linux"))'.dependencies]
cpal = "0.15"
