[package]
name = "bend-harness"
version = "0.1.0"
edition = "2021"
license.workspace = true

# the command is `bise` (BISE-165); the package keeps its name (cargo -p
# bend-harness). The installer still links `bend-harness` to it
# (packaging/install.sh); version dirs no longer do (debt-t3).
[[bin]]
name = "bise"
path = "src/main.rs"

[dependencies]
bise-catalog = { path = "../catalog" }
bise-home = { path = "../home" }
# bise telemetry, and the core's usage sender (telemetry step 5)
bise-usage = { path = "../usage" }
bise-proto = { path = "../proto" }
bise-session = { path = "../session" }
bend-plugins = { path = "../plugins" }
bise-computer-use = { path = "../computer-use" }
bend-tui = { path = "../tui" }
switchboard = { path = "../switchboard" }
serde_json = "1"
