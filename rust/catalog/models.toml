# ---- speech to text (BISE-130): the voice input, ctrl+r ----
# The chat providers above that transcribe have stt = ...; their voice
# models are here, the voice screen's pick first (BISE-298). Checked
# 2026-09-30: Mistral's and OpenAI's /v1/models (audio_transcription;
# each one transcribed 0.5 s of silence with a real key, 200),
# platform.openai.com/docs/guides/speech-to-text (gpt-transcribe: "the
# recommended model for transcribing recorded speech"),
# elevenlabs.io/docs/overview/models (scribe_v2; scribe_v1 "outclassed").
# The realtime ones (voxtral-*-realtime-*, gpt-live-transcribe,
# scribe_v2_realtime) stream: not this batch call.

# Voxtral Transcribe 3: the default voice model (dictation and voice
# mode). Voxtral Mini (voxtral-mini-latest, the realtime mini) is not
# offered: it got too many words wrong (the user, voice mode round 2);
# a config or BISE_VOICE_MODEL naming a voxtral-mini-* id reads as
# Transcribe 3 (bise_catalog::voice::RETIRED_STT_PREFIX).
[models."mistral/voxtral-transcribe-3"]
kind = "stt"

[models."mistral/voxtral-small-transcribe-3"]
kind = "stt"

[models."openai/gpt-transcribe"]
kind = "stt"

[models."openai/gpt-4o-mini-transcribe"]
kind = "stt"

[models."openai/gpt-4o-transcribe"]
kind = "stt"

[models."openai/whisper-1"]
kind = "stt"

# Groq and Deepgram: in the catalog (a key or a [voice] model still
# works), not on the voice screen (hidden; the user, 2026-09-30)
[models."groq/whisper-large-v3-turbo"]
kind = "stt"

[models."groq/whisper-large-v3"]
kind = "stt"

# TypeSafe's Jev (approvals, design §4): the checker of auto mode. It
# answers typed questions (POST <base_url>/systemone), it does not chat:
# not in the chat lists, only in the checker's picker and /provider.
# OpenRouter serves it too (typesafe/jev-1.13, same API, its own key).
[providers.typesafe]
name = "TypeSafe"
kind = "decisions"
hint = "for the checker: it looks at commands in auto mode."
keys_url = "https://typesafe.ai"
base_url = "https://api.typesafe.ai/v1"
key_env = "TYPESAFE_API_KEY"
model = "jev-1.13"

[providers.elevenlabs]
name = "ElevenLabs"
kind = "stt"
stt = "elevenlabs"
hint = "voice only"
keys_url = "https://elevenlabs.io/app/settings/api-keys"
signup_url = "https://elevenlabs.io/app/sign-up"
base_url = "https://api.elevenlabs.io/v1"
key_env = "ELEVENLABS_API_KEY"
voice_model = "scribe_v2"

[models."elevenlabs/scribe_v2"]
kind = "stt"

[models."elevenlabs/scribe_v1"]
kind = "stt"

[providers.deepgram]
name = "Deepgram"
kind = "stt"
hidden = true
stt = "deepgram"
base_url = "https://api.deepgram.com/v1"
key_env = "DEEPGRAM_API_KEY"

# no language set: language=multi (code-switching, French and English)
[models."deepgram/nova-3"]
kind = "stt"
