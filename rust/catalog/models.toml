# bise's built-in model catalog (BISE-142). Read by Rust (rust/catalog),
# compiled into the binary: no network, no third-party service.
#
# Edit by hand. The same two tables work in ~/.bise/config.toml, where
# they add or override entries key by key:
#
#   [providers.<id>]      name, api, base_url, key_env, needs,
#                         + defaults for its models (the fields below)
#   [models."<id>/<model>"]  context, max_output, vision, reasoning, tools
#
# api (the wire family): openai-chat | anthropic | openai-responses |
#   gemini | bedrock-converse. Today the Bend runtime speaks openai-chat,
#   anthropic and openai-responses (BISE-147); the others come with
#   BISE-148/149.
# key_env = "" : no key needed (local servers).
# needs = "BISE-149" : listed, not usable yet (cloud auth).
# small_model = "<id>" : a cheap model of the provider for short labels
#   (the agents' role lines, BISE-126); config `small_model` wins.
# A model field not set comes from its provider, then from the defaults:
#   context 128000, max_output 16384, vision false, reasoning false,
#   tools true.
# Anthropic family only (BISE-146): thinking = "adaptive" | "budget" |
#   "none" (unset: adaptive when the model reasons, none otherwise);
#   betas = the anthropic-beta header (unset: the foundry proxy's list).
#   max_output is the body's max_tokens.
# Reasoning effort (BISE-135), for a model that reasons: efforts = the
#   words it takes, comma-separated (unset: its family's: anthropic
#   none,low,medium,high,max; the others none,low,medium,high);
#   effort = the one it gets when nobody picks (unset: high). /reasoning
#   and config.toml's reasoning_effort / agent_reasoning_effort pick.
# Prompt cache (BISE-268): cache_key = the body field and cache_header =
#   the HTTP header that carry the session's routing key ("bise-<hash>",
#   core/api.bend session_key) to a provider that routes by it; unset:
#   none sent. Only where the provider's docs name one.
# A gateway in front of a provider (Claude Code's ANTHROPIC_BASE_URL,
#   ANTHROPIC_CUSTOM_HEADERS and apiKeyHelper), none built in:
#   headers_env = the env variable holding extra headers, one
#   "Name: value" per line; key_command = a shell command printing the
#   key, run before every call (a short-lived token), its key sent as
#   the family's header and as Authorization: Bearer; with key_env = ""
#   (no '"' or '\' in it: single quotes work). E.g. in config.toml:
#     [providers.gateway]
#     api = "anthropic"
#     base_url = "https://gateway.example/v1"
#     key_env = ""
#     reasoning = true
#     headers_env = "ANTHROPIC_CUSTOM_HEADERS"
#     key_command = "my-tool auth token"
#   then model = "gateway/claude-opus-5-5".
# A slow server (a local model reading a long prompt, a gateway that
#   queues): idle_timeout_sec = how long one read of the streamed reply
#   waits for data, the first byte then each gap between two events, in
#   seconds (1 to 86400; unset: 90). Past it the call retries, and the
#   error names this key. None built in.
# Prices (BISE-150), USD per million tokens: input_price, output_price,
#   cache_read_price, cache_write_price (the two cache ones default to
#   input_price). Unset: the cost is not shown. The list prices, short
#   prompts (a long-context tier costs more).
# Any "<provider>/<model>" works even when the model is not listed here:
# it gets its provider's defaults. Model ids may hold '/': the provider
# is the part before the FIRST '/'.
# Speech to text (BISE-130): stt = "<family>" on a provider that
#   transcribes (mistral | openai | elevenlabs | deepgram: the wire
#   format), kind = "stt" on a provider or a model that only transcribes
#   (not a chat model). config.toml's [voice] picks one: model,
#   language (unset: detected), vocabulary (words to spell right).
# The first run's key step (BISE-266), per provider: hint (a few words),
#   keys_url (where a key is made), signup_url (only when not the keys
#   page), model (the id a new user starts with), hidden = true (not
#   offered: a private proxy, or a provider the first run leaves out;
#   its keys and `bise login <id>` still work). Checked 2026-09-30 against each provider's
#   docs and keys page. billing_url (BISE-282): where credit is added,
#   linked when a key check says the account has none; only where the
#   provider's docs name the page. voice_model (BISE-298): the voice
#   screen's pick among its voice models (unset: its first listed one);
#   hidden also keeps a provider off the voice screen.
# Checked by hand against the providers' docs and /models; last update
# 2026-09-30 (each provider's section says where).

# no default_model (BISE-266): with no model in config.toml and no
# BISE_MODEL / BEND_MODEL, bise has no model and sends nothing; the first
# run's key step picks one from a key it has checked. A config.toml can
# still set default_model.

# the voice input's model (BISE-130) when config.toml's [voice] has none
default_voice_model = "mistral/voxtral-transcribe-3"

# names without a provider (the old config lines keep working)
[aliases]
"opus-5.5" = "foundry/claude-opus-5-5"

# ---- Anthropic ----
# Checked 2026-09-30: platform.claude.com/docs/en/about-claude/models/overview
# (ids, 1M context, 128K output, adaptive thinking), .../pricing (prices,
# 5-minute cache writes), .../build-with-claude/context-windows (1M is the
# default of the 5.x models, no beta header).

[providers.anthropic]
name = "Anthropic"
hint = "Claude, by Anthropic"
keys_url = "https://platform.claude.com/settings/keys"
billing_url = "https://platform.claude.com/settings/billing"
model = "claude-opus-5-5"
api = "anthropic"
base_url = "https://api.anthropic.com/v1"
key_env = "ANTHROPIC_API_KEY"
small_model = "claude-haiku-4-5"
context = 1000000
max_output = 128000
vision = true
reasoning = true
thinking = "adaptive"
betas = "interleaved-thinking-2025-05-14,fine-grained-tool-streaming-2025-05-14"

# "start with Claude Opus 5.5 for most workloads": long-running agentic
# coding
[models."anthropic/claude-opus-5-5"]
input_price = 4
output_price = 20
cache_read_price = 0.2
cache_write_price = 5

# demanding reasoning and long-horizon agentic work
[models."anthropic/claude-fable-5-1"]
input_price = 10
output_price = 50
cache_read_price = 0.25
cache_write_price = 12.5

[models."anthropic/claude-sonnet-5-5"]
input_price = 2
output_price = 10
cache_read_price = 0.2
cache_write_price = 2.5

# extended thinking with a token budget (it rejects adaptive thinking),
# 200k context
[models."anthropic/claude-haiku-4-5"]
thinking = "budget"
context = 200000
max_output = 64000
input_price = 1
output_price = 5
cache_read_price = 0.1
cache_write_price = 1.25

# an Anthropic proxy (the setup before BISE-142); the harness sends the
# 1M-context beta header, so 1M. A private proxy: bise ships no URL, its
# users set base_url under [providers.foundry] in ~/.bise/config.toml, or
# ANTHROPIC_FOUNDRY_BASE_URL like Claude Code (its form, without /v1:
# bise adds it), in the environment or a .env file; config.toml wins.
# Its models: the ones that answered a real tool call through it,
# 2026-09-30 (claude-fable-5-1: a 403, the proxy's account has not
# enabled it).
[providers.foundry]
name = "Anthropic (foundry proxy)"
hidden = true
api = "anthropic"
key_env = "ANTHROPIC_FOUNDRY_API_KEY"
base_url_env = "ANTHROPIC_FOUNDRY_BASE_URL"
small_model = "claude-haiku-4-5"
context = 1000000
max_output = 32768
vision = true
reasoning = true

# the proxy bills Anthropic's list prices
[models."foundry/claude-opus-5-5"]
input_price = 4
output_price = 20
cache_read_price = 0.2
cache_write_price = 5

[models."foundry/claude-sonnet-5-5"]
input_price = 2
output_price = 10
cache_read_price = 0.2
cache_write_price = 2.5

# a budget, like the direct API's (adaptive: "adaptive thinking is not
# supported on this model")
[models."foundry/claude-haiku-4-5"]
thinking = "budget"
context = 200000
input_price = 1
output_price = 5
cache_read_price = 0.1
cache_write_price = 1.25

