[package]
name = "bise-catalog"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "bise's own model catalog: the built-in provider/model list (models.toml) merged with the user's config.toml."

[dependencies]
toml = { version = "1", features = ["preserve_order"] }
serde_json = "1"
libc = "0.2"
bise-home = { path = "../home" }
# where auth.json and the MCP logins live: files or the macOS keychain
bise-secrets = { path = "../secrets" }
# the ChatGPT and OpenRouter sign-ins (src/chatgpt.rs, src/openrouter_login.rs):
# the MCP OAuth helpers and HTTP client (rust/plugins/src/{oauth,http}.rs),
# ring for the ID token's RS256 signature, base64url; all in the lock
bend-plugins = { path = "../plugins" }
ring = "0.17"
base64 = "0.22"
