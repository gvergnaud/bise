[package]
name = "bise-session"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "The bise session log: typed events, reader, writer, resume (BISE-191..194)."

[dependencies]
# where auth.json and the MCP logins live: files or the macOS keychain
bise-secrets = { path = "../secrets" }
# shown_name for /log's message rows (history.rs): one rule, the feed's
bise-proto = { path = "../proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ring = "0.17"
libc = "0.2"
