[package]
name = "bise-proto"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "bise's typed client protocol: the hub's events and the clients' commands, one JSON object per line (bise desktop S3a)."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "12.0.1", optional = true, features = ["serde-json-impl", "no-serde-warnings"] }

[features]
# TypeScript types for apps/desktop/src/proto (tests/ts.rs writes and checks
# them); off by default so bise and sb never compile ts-rs
ts = ["dep:ts-rs"]
