<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Chart</title>
<!-- bise-view-kit -->
<style>
  .head { display: flex; align-items: flex-start; gap: var(--k-s-2); }
  .titles { flex: 1; min-width: 0; }
  .titles .k-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .titles .k-dim { font-size: var(--k-t-sm); margin-top: 2px; }
  .k-toolbar { opacity: 0; transition: opacity var(--k-fast) var(--k-ease); }
  body:hover .k-toolbar, .k-toolbar:focus-within { opacity: 1; }
  .k-legend { margin-top: var(--k-s-2); }
  .k-legend button { font: inherit; display: inline-flex; align-items: center; gap: var(--k-s-1); border: 0; padding: 0; background: none; color: inherit; cursor: pointer; }
  .k-legend button[aria-pressed="false"] { opacity: .4; }
  .k-legend button[aria-pressed="false"] .k-swatch { background: var(--k-text-3) !important; }
  .chart { margin-top: var(--k-s-3); position: relative; }
  .chart svg { display: block; overflow: visible; font-family: var(--k-sans); font-size: var(--k-t-sm); font-variant-numeric: tabular-nums; }
  .chart svg.hl [data-tip]:not(.on) { opacity: .35; }
  .chart svg [data-tip] { transition: opacity var(--k-fast) var(--k-ease); }
  .k-skeleton { height: 220px; }
  .foot { margin-top: var(--k-s-2); }
  .tip-h { font-weight: 600; margin-bottom: 2px; }
  .tip-r { display: flex; align-items: center; gap: var(--k-s-1); font-variant-numeric: tabular-nums; }
  .tip-r i { width: 8px; height: 8px; border-radius: 2px; flex: none; }
  .tip-r span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: var(--k-s-3); }
  .tip-r b { font-weight: 600; }
  #export { position: absolute; left: -100000px; top: 0; }
  html[data-mode="fullscreen"] .k-app { height: 100%; display: flex; flex-direction: column; }
</style>
</head>
<body>
<div class="k-app" id="app">
  <div class="head">
    <div class="titles"><h1 class="k-title" id="title">Chart</h1><div class="k-dim" id="subtitle" hidden></div></div>
    <div class="k-toolbar" id="tools" hidden>
      <button class="k-btn k-ghost" id="svg" title="Download as SVG">SVG</button>
      <button class="k-btn k-ghost" id="png" title="Download as PNG">PNG</button>
      <button class="k-btn k-ghost k-icon" id="full" title="Open in the panel" aria-label="Open in the panel">⤢</button>
    </div>
  </div>
  <div class="k-legend" id="legend" hidden></div>
  <div class="chart" id="chart" data-testid="chart"><div class="k-skeleton"></div></div>
  <div class="k-faint foot" id="foot" hidden></div>
</div>
<div id="export" aria-hidden="true"></div>
<!-- dataviz-charts -->
<script>
// The chart's shell: takes the tool's result, draws it with DV.kinds[kind] at the
// view's width, and owns the legend toggles, the tooltip, the export and the
// display mode. Every text from the result goes through kit.esc / DV.esc.
const $ = (id) => document.getElementById(id);
const app = kit.app, esc = kit.esc;
let chart = null, drawing = null, hidden = new Set(), hover = null, lastW = 0;

function opts(width) {
  const c = app.context || {};
  return {
    width, hidden, locale: c.locale, unit: chart.unit,
    fullscreen: document.documentElement.dataset.mode === "fullscreen",
    utc: !(chart.time && chart.time.zoned),
    withTime: Boolean(chart.time && chart.time.with_time),
  };
}

function note(text, err) {
  const n = document.createElement("div");
  n.className = err ? "k-note k-err" : "k-note";
  n.textContent = text;
  $("chart").replaceChildren(n);
}

function show(c) {
  chart = c;
  $("title").textContent = c.title || "Chart";
  $("subtitle").textContent = c.subtitle || "";
  $("subtitle").hidden = !c.subtitle;
  $("foot").textContent = c.note || "";
  $("foot").hidden = !c.note;
  if (!DV.kinds[c.kind]) { note(`This view can't draw a “${c.kind}” chart: bise's dataviz plugin may need an update.`, true); return; }
  $("tools").hidden = false;
  draw();
}

function draw() {
  if (!chart || !DV.kinds[chart.kind]) return;
  const width = Math.max(260, Math.floor($("chart").clientWidth || 560));
  lastW = width;
  try { drawing = DV.kinds[chart.kind].draw(chart, opts(width)); }
  catch (e) { note("The chart could not be drawn: " + e.message, true); return; }
  $("chart").innerHTML = `<svg width="${width}" height="${drawing.height}" viewBox="0 0 ${width} ${drawing.height}" role="img" aria-label="${esc(chart.title)}">${drawing.svg}<g id="hov" pointer-events="none"></g></svg>`;
  legend();
  hover = null;
}

function legend() {
  const L = drawing.legend || [];
  $("legend").hidden = !L.length;
  $("legend").innerHTML = L.map((s, i) =>
    `<button type="button" data-i="${i}" aria-pressed="${!s.off}"><i class="k-swatch" style="background:${s.color}"></i>${esc(s.name)}</button>`).join("");
}
$("legend").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-i]");
  if (!b) return;
  const name = drawing.legend[+b.dataset.i].name;
  if (hidden.has(name)) hidden.delete(name);
  else if (drawing.legend.filter((s) => !s.off).length > 1) hidden.add(name); // never hide the last one
  draw();
});

// ---- hover: an element's own tip (data-tip), else the drawing's hover()
function track(e) {
  const svg = $("chart").querySelector("svg");
  if (!svg || !drawing) { hover = null; return; }
  const r = svg.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  const el = e.target.closest && e.target.closest("[data-tip]");
  const hov = $("hov");
  svg.querySelectorAll(".on").forEach((n) => n.classList.remove("on"));
  hov.innerHTML = "";
  if (el) {
    const i = el.dataset.tip;
    svg.querySelectorAll(`[data-tip="${i}"]`).forEach((n) => n.classList.add("on"));
    svg.classList.add("hl");
    hover = drawing.tips[+i];
    return;
  }
  svg.classList.remove("hl");
  const h = drawing.hover ? drawing.hover(x, y) : null;
  if (!h) { hover = null; return; }
  let s = "";
  if (h.band) s += `<rect x="${h.band.x}" y="${h.band.y}" width="${h.band.w}" height="${h.band.h}" style="fill:var(--k-hover)"/>`;
  if (h.guide) s += `<line x1="${h.guide.x}" x2="${h.guide.x}" y1="${h.guide.y1}" y2="${h.guide.y2}" style="stroke:var(--k-line-strong);stroke-width:1"/>`;
  for (const d of h.dots || []) s += `<circle cx="${d.x}" cy="${d.y}" r="3.5" style="fill:var(--k-bg);stroke:${d.color};stroke-width:2"/>`;
  hov.innerHTML = s;
  hover = h.tip;
}
$("chart").addEventListener("pointermove", track);
$("chart").addEventListener("pointerleave", () => {
  hover = null;
  const svg = $("chart").querySelector("svg");
  if (!svg) return;
  svg.classList.remove("hl");
  svg.querySelectorAll(".on").forEach((n) => n.classList.remove("on"));
  $("hov").innerHTML = "";
});
kit.tip($("chart"), () => hover);

// ---- export: the title, the legend, the chart and the note in one SVG
function exportSvg() {
  const W = lastW + 32, pad = 16, ns = "http://www.w3.org/2000/svg";
  let y = pad + 14, s = `<text x="${pad}" y="${y}" style="fill:var(--k-text);font-size:var(--k-t-md);font-weight:600">${DV.esc(chart.title)}</text>`;
  if (chart.subtitle) { y += 18; s += `<text x="${pad}" y="${y}" style="fill:var(--k-text-2)">${DV.esc(chart.subtitle)}</text>`; }
  const L = (drawing.legend || []).filter((l) => !l.off);
  if (L.length) {
    y += 22;
    let x = pad;
    for (const l of L) {
      const w = DV.textW(l.name) + 26;
      if (x + w > W - pad && x > pad) { x = pad; y += 18; }
      s += `<rect x="${x}" y="${y - 8}" width="8" height="8" rx="2" style="fill:${l.color}"/><text x="${x + 12}" y="${y}" style="fill:var(--k-text-2)">${DV.esc(l.name)}</text>`;
      x += w;
    }
  }
  y += 14;
  s += `<g transform="translate(${pad},${y})">${drawing.svg}</g>`;
  y += drawing.height;
  if (chart.note) { y += 20; s += `<text x="${pad}" y="${y}" style="fill:var(--k-text-3)">${DV.esc(chart.note)}</text>`; }
  const H = y + pad;
  $("export").innerHTML = `<svg xmlns="${ns}" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="font-family:var(--k-sans);font-size:var(--k-t-sm);font-variant-numeric:tabular-nums">${s}</svg>`;
  return $("export").firstChild;
}
const fileName = () => (chart.title || "chart").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 60) || "chart";
async function save(kind, btn) {
  const svg = exportSvg();
  const was = btn.textContent;
  try {
    await (kind === "png" ? kit.savePng(svg, fileName() + ".png", 2) : kit.saveSvg(svg, fileName() + ".svg"));
  } catch (e) {
    btn.textContent = "failed";
    setTimeout(() => { btn.textContent = was; }, 1600);
  } finally { $("export").innerHTML = ""; }
}
$("svg").onclick = (e) => save("svg", e.currentTarget);
$("png").onclick = (e) => save("png", e.currentTarget);
$("full").onclick = async () => {
  const full = document.documentElement.dataset.mode === "fullscreen";
  try { await app.displayMode(full ? "inline" : "fullscreen"); } catch { /* the host said no: stay */ }
};

// ---- the host
app.on("tool-input", (p) => {
  const a = (p && p.arguments) || {};
  if (a.title && !chart) $("title").textContent = String(a.title);
});
app.on("tool-result", (r) => {
  if (r.isError) { note(((r.content || [])[0] || {}).text || "No chart.", true); return; }
  const c = r.structuredContent;
  if (!c || typeof c !== "object" || !c.kind) { note("This result holds no chart.", true); return; }
  show(c);
});
app.on("tool-cancelled", () => note("The chart was cancelled."));
app.on("context", () => {
  const full = document.documentElement.dataset.mode === "fullscreen";
  $("full").title = full ? "Back to the thread" : "Open in the panel";
  $("full").setAttribute("aria-label", $("full").title);
  draw();
});
new ResizeObserver(() => {
  const w = Math.floor($("chart").clientWidth);
  if (chart && Math.abs(w - lastW) > 1) requestAnimationFrame(draw);
}).observe($("chart"));
app.start("dataviz");
</script>
</body>
</html>
