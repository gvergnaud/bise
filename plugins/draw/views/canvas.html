<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Drawing</title>
<!-- bise-view-kit -->
<!-- draw-core -->
<style>
  .wrap { display: flex; flex-direction: column; gap: var(--k-s-2); padding: var(--k-s-2) var(--k-s-3) var(--k-s-2); }
  html[data-mode="fullscreen"] .wrap { height: 100vh; }
  .bar { display: flex; align-items: center; gap: var(--k-s-2); flex-wrap: wrap; }
  .title { font: inherit; font-weight: 600; font-size: var(--k-t-md); color: var(--k-text); border: 1px solid transparent; border-radius: var(--k-r-sm); background: transparent; height: var(--k-h-control); padding: 0 var(--k-s-1); min-width: 60px; max-width: 320px; text-overflow: ellipsis; }
  .title:hover { border-color: var(--k-line); }
  .title:focus { outline: none; border-color: var(--k-line-strong); background: var(--k-bg); }
  .tools { display: inline-flex; gap: 2px; padding: 2px; border-radius: var(--k-r-sm); background: var(--k-bg-2); }
  .tools .k-btn { border-color: transparent; background: transparent; color: var(--k-text-2); height: 22px; width: 26px; }
  .tools .k-btn:hover { color: var(--k-text); }
  .tools .k-btn[aria-pressed="true"] { background: var(--k-bg); color: var(--k-text); box-shadow: var(--k-shadow); }
  .sep { width: 1px; height: 16px; background: var(--k-line); }
  svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .stage { position: relative; height: 440px; border-radius: var(--k-r-md); border: 1px solid var(--k-line); overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
    background-color: var(--k-bg); background-image: radial-gradient(var(--k-line) 1px, transparent 1.2px); }
  html[data-mode="fullscreen"] .stage { flex: 1; height: auto; }
  .stage svg.canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .stage[data-tool="select"] { cursor: default; }
  .stage[data-tool="hand"], .stage.panning { cursor: grab; }
  .stage.panning:active { cursor: grabbing; }
  .stage[data-tool="rect"], .stage[data-tool="ellipse"], .stage[data-tool="diamond"], .stage[data-tool="arrow"], .stage[data-tool="line"], .stage[data-tool="draw"] { cursor: crosshair; }
  .stage[data-tool="text"] { cursor: text; }
  .sel-box { fill: none; stroke: var(--k-accent); stroke-width: 1; }
  .sel-hover { fill: none; stroke: var(--k-accent); stroke-width: 1; stroke-dasharray: 3 3; opacity: .7; }
  .marquee { fill: var(--k-accent-soft); fill-opacity: .5; stroke: var(--k-accent); stroke-width: 1; }
  .handle { fill: var(--k-bg); stroke: var(--k-accent); stroke-width: 1.2; }
  .bind { fill: none; stroke: var(--k-accent); stroke-width: 2; opacity: .55; }
  .fade { position: absolute; pointer-events: none; z-index: 2; opacity: 0; transition: opacity var(--k-fast) var(--k-ease); }
  .fade.on { opacity: 1; }
  .fade.r { top: 0; right: 0; bottom: 0; width: 16px; background: linear-gradient(to left, var(--k-bg), transparent); }
  .fade.l { top: 0; left: 0; bottom: 0; width: 16px; background: linear-gradient(to right, var(--k-bg), transparent); }
  .fade.b { left: 0; right: 0; bottom: 0; height: 16px; background: linear-gradient(to top, var(--k-bg), transparent); }
  .fade.t { left: 0; right: 0; top: 0; height: 16px; background: linear-gradient(to bottom, var(--k-bg), transparent); }
  .empty { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--k-s-1); color: var(--k-text-3); font-size: var(--k-t-sm); pointer-events: none; text-align: center; }
  .empty[hidden] { display: none; }
  .empty b { color: var(--k-text-2); font-weight: 500; font-size: var(--k-t-md); }
  .props { position: absolute; top: var(--k-s-2); display: flex; flex-direction: column; gap: var(--k-s-2); padding: var(--k-s-2); width: 184px;
    border-radius: var(--k-r-md); background: var(--k-bg); box-shadow: var(--k-shadow-md); font-size: var(--k-t-xs); color: var(--k-text-2);
    max-height: calc(100% - 2 * var(--k-s-2)); overflow: auto; z-index: 3; }
  .props[hidden] { display: none; }
  .props .lbl { margin-bottom: var(--k-s-1); }
  .swatches { display: flex; flex-wrap: wrap; gap: var(--k-s-1); }
  .sw { width: 20px; height: 20px; border-radius: var(--k-r-sm); border: 1px solid var(--k-line); cursor: pointer; padding: 0; display: inline-flex; align-items: center; justify-content: center; background: var(--k-bg); }
  .sw[aria-pressed="true"] { outline: 2px solid var(--k-focus); outline-offset: 1px; }
  .sw i { display: block; width: 12px; height: 12px; border-radius: 3px; }
  .sw.none i { background: linear-gradient(135deg, transparent 45%, var(--k-err) 45% 55%, transparent 55%); border: 1px solid var(--k-line-strong); }
  .props .k-seg { display: flex; }
  .props .k-seg button { flex: 1; padding: 0 var(--k-s-1); }
  .props .row { display: flex; gap: var(--k-s-1); }
  .props .row .k-btn { flex: 1; justify-content: center; }
  .props .row.del { padding-top: var(--k-s-1); border-top: 1px solid var(--k-line); }
  .props .row.del .k-btn { color: var(--k-err); }
  .props .row.del .k-btn:hover { background: var(--k-err-soft); }
  .editor { position: absolute; margin: 0; padding: 0; border: 0; outline: none; resize: none; overflow: hidden; background: transparent; white-space: pre; line-height: 1.25; z-index: 5; }
  .zoom { position: absolute; right: var(--k-s-2); bottom: var(--k-s-2); display: flex; align-items: center; gap: 2px; padding: 2px; border-radius: var(--k-r-sm); background: var(--k-bg); box-shadow: var(--k-shadow); }
  .zoom .k-btn { border-color: transparent; height: 22px; }
  .zoom .pct { min-width: 44px; justify-content: center; font-variant-numeric: tabular-nums; }
  .foot { display: flex; align-items: center; gap: var(--k-s-2); font-size: var(--k-t-xs); color: var(--k-text-3); min-height: 16px; white-space: nowrap; min-width: 0; }
  .foot #live { flex: none; }
  .foot .status { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .dot { width: 6px; height: 6px; border-radius: var(--k-r-full); background: var(--k-text-3); flex: none; }
  .dot.off { background: transparent; box-shadow: inset 0 0 0 1px var(--k-text-3); }
  .dot.agent { width: auto; height: auto; background: none; line-height: 1; }
  .dot.agent::before { content: "∿"; }
  .status.err { color: var(--k-err); }
  .hint { margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 0 1000 auto; }
  /* the head never wraps: it gives way (fitBar) - the shape tools fold into a picker,
     then Export and the panel into ⋯, then the title is cut; Send to agent stays whole */
  .bar { flex-wrap: nowrap; min-width: 0; }
  .bar > * { flex: none; }
  .bar .title { flex: 0 1 auto; min-width: 48px; overflow: hidden; }
  .bar.measuring .title { flex-shrink: 0; }
  .bar .k-spacer { flex: 1 1 0; min-width: 0; }
  .wide { display: inline-flex; align-items: center; gap: var(--k-s-1); }
  .picker { gap: 2px; padding: 0 var(--k-s-1); }
  .picker .chev { width: 12px; height: 12px; }
  .bar.fold-tools .tools, .bar:not(.fold-tools) .picker { display: none; }
  /* nothing to send: the kit's quiet look, never a grey primary */
  #send[aria-disabled="true"] { background: transparent; color: var(--k-text-3); border-color: var(--k-line); cursor: default; }
  .bar.fold-more .wide, .bar:not(.fold-more) #more { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <input class="title" id="title" data-testid="title" aria-label="Drawing title" spellcheck="false">
    <div class="tools" id="tools" role="toolbar" aria-label="Tools"></div>
    <button class="k-btn k-ghost picker" id="picker" data-testid="tool-picker" aria-label="Tools"><span id="pickerIcon"></span><svg class="i chev" viewBox="0 0 20 20"><path d="M6 8l4 4 4-4"/></svg></button>
    <span class="k-spacer"></span>
    <button class="k-btn k-ghost k-icon" id="undo" aria-label="Undo"><svg class="i" viewBox="0 0 20 20"><path d="M7 5L3 9l4 4"/><path d="M3 9h9a5 5 0 010 10h-2"/></svg></button>
    <button class="k-btn k-ghost k-icon" id="redo" aria-label="Redo"><svg class="i" viewBox="0 0 20 20"><path d="M13 5l4 4-4 4"/><path d="M17 9H8a5 5 0 000 10h2"/></svg></button>
    <span class="sep"></span>
    <span class="wide" id="wide">
      <button class="k-btn k-ghost" id="exportBtn" data-testid="export"><svg class="i" viewBox="0 0 20 20"><path d="M10 3v10M6 9l4 4 4-4M4 16h12"/></svg>Export</button>
      <button class="k-btn k-ghost k-icon" id="panel" aria-label="Open in the panel"><svg class="i" viewBox="0 0 20 20"><path d="M12 3h5v5M8 17H3v-5M17 3l-6 6M3 17l6-6"/></svg></button>
    </span>
    <button class="k-btn k-ghost k-icon" id="more" data-testid="more" aria-label="More"><svg class="i" viewBox="0 0 20 20"><path d="M5 10h.01M10 10h.01M15 10h.01" stroke-width="2.6"/></svg></button>
    <button class="k-btn k-primary" id="send" data-testid="send" aria-disabled="true"><svg class="i" viewBox="0 0 20 20"><path d="M4 10h11M11 6l4 4-4 4"/></svg>Send to agent</button>
  </div>
  <div class="stage" id="stage" data-tool="select" data-testid="stage" tabindex="0">
    <svg class="canvas" id="svg" xmlns="http://www.w3.org/2000/svg"><g id="world"><g id="els"></g><g id="over"></g></g></svg>
    <div class="fade t" id="fadeT"></div><div class="fade r" id="fadeR"></div><div class="fade b" id="fadeB"></div><div class="fade l" id="fadeL"></div>
    <div class="empty" id="empty" hidden><b>Nothing drawn yet</b><span>Pick a tool above, or ask the agent to draw something.</span></div>
    <div class="props" id="props" hidden data-testid="props"></div>
    <div class="zoom" id="zoomBox">
      <button class="k-btn k-icon" id="zout" aria-label="Zoom out"><svg class="i" viewBox="0 0 20 20"><path d="M5 10h10"/></svg></button>
      <button class="k-btn pct" id="zpct" aria-label="Fit the drawing">100%</button>
      <button class="k-btn k-icon" id="zin" aria-label="Zoom in"><svg class="i" viewBox="0 0 20 20"><path d="M5 10h10M10 5v10"/></svg></button>
      <button class="k-btn k-icon" id="zall" aria-label="Show all" data-testid="show-all"><svg class="i" viewBox="0 0 20 20"><circle cx="10" cy="10" r="5"/><path d="M10 2v4M10 14v4M2 10h4M14 10h4"/></svg></button>
    </div>
  </div>
  <div class="foot"><span class="dot" id="dot"></span><span id="live" data-testid="live">connecting…</span><span class="status" id="status" data-testid="status"></span><span class="hint" id="hint"></span></div>
</div>
<script>
"use strict";
const app = kit.app, D = DrawCore, esc = kit.esc;
const $ = (id) => document.getElementById(id);
const SVGNS = "http://www.w3.org/2000/svg";

// ---- text measure: the real fonts (the server only guesses)
const mctx = document.createElement("canvas").getContext("2d");
D.setMeasure((line, font, size) => { mctx.font = `${size}px ${D.FONTS[font] || D.FONTS.hand}`; return mctx.measureText(line).width; });

// ---- state
let doc = null;          // {id, title, rev, ...} as the server last said
let els = [];            // the elements as they are here (his edits included)
let synced = [];         // the elements of doc.rev (the server's)
let agentBase = [];      // the elements at the last rev the agent made: his edits are the diff from it
let sel = new Set(), tool = "select", view = { x: 0, y: 0, k: 1 }, hover = null, bindTarget = null, editing = null;
let undoStack = [], redoStack = [], drag = null, spaceDown = false, fitted = false, clip = [];
let saveTimer = 0, saving = false, pollTimer = 0, snapTimer = 0, lastSnap = 0, quietUntil = 0, ctxTimer = 0, alive = true, failures = 0;
let theme = "light", nextN = 1;
const clone = (x) => JSON.parse(JSON.stringify(x));
const byId = (id) => els.find((e) => e.id === id);

// ---- tools
const ICONS = {
  select: '<path d="M5 3l10 5.5-4.5 1.3L8.6 15z"/>',
  hand: '<path d="M10 2v16M2 10h16M7 5l3-3 3 3M7 15l3 3 3-3M5 7l-3 3 3 3M15 7l3 3-3 3"/>',
  rect: '<rect x="3" y="5" width="14" height="10" rx="1"/>',
  ellipse: '<ellipse cx="10" cy="10" rx="7.5" ry="5.5"/>',
  diamond: '<path d="M10 2.5l7.5 7.5-7.5 7.5L2.5 10z"/>',
  arrow: '<path d="M4 16L16 4M9 4h7v7"/>',
  line: '<path d="M4 16L16 4"/>',
  draw: '<path d="M3 15c3-6 5 2 8-3s3-6 6-7"/>',
  text: '<path d="M5 5h10M10 5v11M8 16h4"/>',
};
const TOOLS = [["select", "Select · V"], ["hand", "Pan · H or hold space"], ["rect", "Box · R"], ["ellipse", "Ellipse · O"], ["diamond", "Diamond · D"], ["arrow", "Arrow · A"], ["line", "Line · L"], ["draw", "Pencil · P"], ["text", "Text · T"]];
const KEYS = { v: "select", h: "hand", r: "rect", o: "ellipse", d: "diamond", a: "arrow", l: "line", p: "draw", t: "text" };
$("tools").innerHTML = TOOLS.map(([t, label]) => `<button class="k-btn k-icon" data-tool="${t}" aria-label="${esc(label)}" aria-pressed="${t === tool}"><svg class="i" viewBox="0 0 20 20">${ICONS[t]}</svg></button>`).join("");
for (const b of $("tools").querySelectorAll("button")) { b.onclick = () => setTool(b.dataset.tool); kit.tip(b, esc(b.getAttribute("aria-label"))); }
for (const [id, t] of [["undo", "Undo · ⌘Z"], ["redo", "Redo · ⇧⌘Z"], ["panel", "Open in the panel"], ["zpct", "Fit the drawing"], ["zall", "Show all"]]) kit.tip($(id), esc(t));
// Send to agent: aria-disabled, not disabled (a disabled button gets no hover, so no tip)
kit.tip($("send"), () => (sendable() ? "Tell the agent what you changed" : "nothing new to send"));
const sendable = () => $("send").getAttribute("aria-disabled") !== "true";
function setSendable(on) { $("send").setAttribute("aria-disabled", String(!on)); }
function setTool(t) {
  tool = t;
  $("pickerIcon").innerHTML = `<svg class="i" viewBox="0 0 20 20">${ICONS[t]}</svg>`;
  $("stage").dataset.tool = t;
  for (const b of $("tools").querySelectorAll("button")) b.setAttribute("aria-pressed", String(b.dataset.tool === t));
  if (t !== "select") { sel.clear(); paint(); }
  hint();
}
// a fade on each edge that cuts the drawing
function cutCue() {
  const b = D.sceneBounds(els), r = $("stage").getBoundingClientRect();
  const s = b ? { x0: b.x * view.k + view.x, y0: b.y * view.k + view.y, x1: (b.x + b.w) * view.k + view.x, y1: (b.y + b.h) * view.k + view.y } : null;
  const cut = { L: s && s.x0 < -1, R: s && s.x1 > r.width + 1, T: s && s.y0 < -1, B: s && s.y1 > r.height + 1 };
  for (const k of ["L", "R", "T", "B"]) $("fade" + k).classList.toggle("on", !!cut[k]);
}
function hint() {
  const h = { select: "drag to move · double-click to write · ⌫ deletes", hand: "drag to pan", text: "click to write", arrow: "drag from a shape to another", line: "drag to draw a line", draw: "drag to draw" }[tool] || "drag to draw · shift for a square";
  $("hint").textContent = h;
}

// ---- coordinates
const toWorld = (e) => { const r = $("svg").getBoundingClientRect(); return [(e.clientX - r.left - view.x) / view.k, (e.clientY - r.top - view.y) / view.k]; };
function applyView() {
  $("world").setAttribute("transform", `translate(${view.x} ${view.y}) scale(${view.k})`);
  const s = 20 * view.k;
  $("stage").style.backgroundSize = `${s}px ${s}px`;
  $("stage").style.backgroundPosition = `${view.x}px ${view.y}px`;
  $("zpct").textContent = Math.round(view.k * 100) + "%";
  placeEditor();
  cutCue();
}
let moved = false; // he zoomed or panned himself: no refit on a resize
function zoomAt(k, sx, sy) {
  moved = true;
  k = Math.max(0.1, Math.min(4, k));
  view.x = sx - ((sx - view.x) * k) / view.k; view.y = sy - ((sy - view.y) * k) / view.k; view.k = k;
  applyView(); paintOver();
}
// is the whole drawing on screen?
function inView() {
  const b = D.sceneBounds(els), r = $("stage").getBoundingClientRect();
  if (!b) return true;
  const x0 = b.x * view.k + view.x, y0 = b.y * view.k + view.y;
  return x0 >= 0 && y0 >= 0 && x0 + b.w * view.k <= r.width && y0 + b.h * view.k <= r.height;
}
const INLINE_MIN = 240, INLINE_MAX = 560, MIN_TEXT = 12, INLINE_ZOOM = 0.6;
// the zoom under which the drawing's smallest text drops below MIN_TEXT
function minZoom() {
  let small = Infinity;
  for (const e of els) {
    if (e.type === "frame") { if (e.text) small = Math.min(small, 14); }
    else if (e.points) { if (e.label) small = Math.min(small, Math.max(10, e.fontSize * 0.8)); }
    else if (e.text) small = Math.min(small, e.fontSize);
  }
  const floor = small === Infinity ? 0.1 : Math.min(1, MIN_TEXT / small);
  // inline, the whole drawing first, even under the 12 px floor, down to INLINE_ZOOM
  return fullscreen() ? floor : Math.min(floor, INLINE_ZOOM);
}
function fit(all) {
  moved = false;
  const b = D.sceneBounds(els);
  if (b && document.documentElement.dataset.mode !== "fullscreen") {
    // inline, the stage takes the drawing's height (at most 1:1), within bounds
    const w = $("stage").getBoundingClientRect().width, top = els.some((e) => e.type === "frame" && e.text) ? D.FRAME_LABEL : 0;
    const k = Math.max(all ? 0.1 : minZoom(), Math.min(1, (w - 80) / Math.max(b.w, 1)));
    $("stage").style.height = Math.round(Math.max(INLINE_MIN, Math.min(INLINE_MAX, (b.h + top) * k + 80))) + "px";
    if (grownFrom != null) { grownFrom = $("stage").style.height; if (parseFloat(grownFrom) < PANEL_MIN) $("stage").style.height = PANEL_MIN + "px"; }
  } else $("stage").style.height = "";
  const r = $("stage").getBoundingClientRect();
  if (!b || !r.width) { view = { x: r.width / 2, y: r.height / 2, k: 1 }; applyView(); return; }
  const pad = 40, top = els.some((e) => e.type === "frame" && e.text) ? D.FRAME_LABEL : 0;
  const k = Math.max(all ? 0.1 : minZoom(), Math.min(1, (r.width - 2 * pad) / Math.max(b.w, 1), (r.height - 2 * pad) / Math.max(b.h + top, 1)));
  // centered when it fits; else from its top-left corner (the rest pans)
  const cx = b.w * k <= r.width - 2 * pad ? r.width / 2 - (b.x + b.w / 2) * k : pad - b.x * k;
  const cy = (b.h + top) * k <= r.height - 2 * pad ? r.height / 2 - (b.y - top + (b.h + top) / 2) * k : pad - (b.y - top) * k;
  view = { k, x: cx, y: cy };
  applyView();
}

// ---- painting
const cache = new Map();
function bgColor() { return getComputedStyle(document.body).backgroundColor || D.BG[theme]; }
function paint() {
  const bg = bgColor();
  let out = "";
  for (const el of D.paintOrder(els)) {
    const shown = editing && editing.id === el.id ? { ...el, [editing.field]: "" } : el;
    const key = JSON.stringify(shown) + theme + bg;
    let c = cache.get(el.id);
    if (!c || c[0] !== key) { c = [key, D.render(shown, theme, bg)]; cache.set(el.id, c); }
    out += c[1];
  }
  $("els").innerHTML = out;
  $("empty").hidden = els.length > 0 || !!drag;
  paintOver();
  props();
  $("undo").disabled = !undoStack.length; $("redo").disabled = !redoStack.length;
}
function rectEl(cls, b, pad) {
  const p = (pad || 0) / view.k;
  return `<rect class="${cls}" x="${b.x - p}" y="${b.y - p}" width="${b.w + 2 * p}" height="${b.h + 2 * p}" vector-effect="non-scaling-stroke"/>`;
}
function handles(el) {
  const s = 4 / view.k;
  if (el.points) {
    if (el.type === "draw") return [];
    return [[el.points[0], "p0"], [el.points[el.points.length - 1], "p1"]].map(([p, h]) => ({ h, x: p[0], y: p[1], s }));
  }
  if (el.type === "frame") return [];
  return [["nw", el.x, el.y], ["ne", el.x + el.w, el.y], ["sw", el.x, el.y + el.h], ["se", el.x + el.w, el.y + el.h]].map(([h, x, y]) => ({ h, x, y, s }));
}
function paintOver() {
  let out = "";
  if (hover && !sel.has(hover) && byId(hover) && tool === "select") out += rectEl("sel-hover", D.bounds(byId(hover)), 4);
  if (bindTarget && byId(bindTarget)) out += rectEl("bind", D.bounds(byId(bindTarget)), 5);
  for (const id of sel) { const el = byId(id); if (el) out += rectEl("sel-box", D.bounds(el), 5); }
  if (sel.size === 1) {
    const el = byId([...sel][0]);
    if (el) for (const h of handles(el)) out += el.points
      ? `<circle class="handle" cx="${h.x}" cy="${h.y}" r="${h.s * 1.3}" vector-effect="non-scaling-stroke"/>`
      : `<rect class="handle" x="${h.x - h.s}" y="${h.y - h.s}" width="${2 * h.s}" height="${2 * h.s}" rx="${h.s / 3}" vector-effect="non-scaling-stroke"/>`;
  }
  if (drag && drag.kind === "marquee") out += rectEl("marquee", norm(drag.a, drag.b));
  $("over").innerHTML = out;
}
const norm = (a, b) => ({ x: Math.min(a[0], b[0]), y: Math.min(a[1], b[1]), w: Math.abs(b[0] - a[0]), h: Math.abs(b[1] - a[1]) });

// ---- the style panel
const NAMES = Object.keys(D.PALETTE);
function common(list, k) { const v = list.map((e) => e[k]); return v.every((x) => x === v[0]) ? v[0] : undefined; }

function endDrag() {

    if (tiny && el.points) { els = els.filter((x) => x !== el); paint(); return; }

stage.addEventListener("pointerup", endDrag);
stage.addEventListener("pointercancel", endDrag);
stage.addEventListener("pointerleave", () => { if (hover) { hover = null; paintOver(); } });
function dbl(e) {
  drag = null;
  const p = toWorld(e);
  const el = topAt(p, 4 / view.k);
  if (!el) return newText(p);
  if (el.type === "draw") return;
  edit(el, el.points ? "label" : "text");
}
stage.addEventListener("wheel", (e) => {
  const r = $("svg").getBoundingClientRect();
  if (e.ctrlKey || e.metaKey) { e.preventDefault(); zoomAt(view.k * Math.exp(-e.deltaY * 0.01), e.clientX - r.left, e.clientY - r.top); return; }
  // inline, a plain wheel scrolls the thread; in the panel it pans
  if (document.documentElement.dataset.mode !== "fullscreen") return;
  e.preventDefault();
  moved = true;
  view.x -= e.deltaX; view.y -= e.deltaY; applyView();
}, { passive: false });

// ---- text editing (an overlay textarea over the element)
function newText(p) {
  const before = snapshot();
  const el = D.clean({ type: "text", x: p[0], y: p[1] - 12, text: "", fontSize: 20 }, newId("text"));
  el.by = "user";
  els.push(el);
  sel = new Set([el.id]);
  setTool("select");
  edit(el, "text", before, true);
}
function edit(el, field, before, fresh) {
  const ta = document.createElement("textarea");
  ta.className = "editor";
  ta.value = el[field] || "";
  ta.setAttribute("data-testid", "editor");
  stage.appendChild(ta);
  editing = { id: el.id, field, ta, before: before || snapshot(), fresh };
  placeEditor();
  paint();
  ta.focus();
  ta.setSelectionRange(ta.value.length, ta.value.length);
  ta.addEventListener("input", placeEditor);
  ta.addEventListener("keydown", (e) => {
    e.stopPropagation();
    if (e.key === "Escape" || (e.key === "Enter" && !e.shiftKey)) { e.preventDefault(); commitEdit(); }
  });

}
function placeEditor() {
  if (!editing) return;
  const el = byId(editing.id), ta = editing.ta;
  if (!el) return;
  const size = (editing.field === "label" ? Math.max(10, el.fontSize * 0.8) : el.fontSize), k = view.k;
  const s = D.textSize(ta.value || " ", el.font, size);
  ta.style.font = `${size * k}px ${D.FONTS[el.font]}`;
  ta.style.color = D.color(el.stroke, theme);
  const w = Math.max(s.w + size, 40) * k, h = s.h * k + 4;
  let cx, cy, left;
  if (el.points) { [cx, cy] = D.midpoint(el.points); }
  else if (el.type === "text") { left = el.x; cy = el.y + s.h / 2; }
  else { cx = el.x + el.w / 2; cy = el.y + el.h / 2; }
  ta.style.textAlign = el.type === "text" ? (el.align === "center" ? "center" : "left") : "center";
  ta.style.width = w + "px"; ta.style.height = h + "px";
  ta.style.left = (left != null && el.align !== "center" ? left * k + view.x : (left != null ? (el.x + el.w / 2) : cx) * k + view.x - w / 2) + "px";

function commitEdit() {
  if (!editing) return;

  ta.remove();

    if (v) el[field] = v; else delete el[field];

    else if (D.SHAPES.includes(el.type) && v) { const f = D.fit({ ...el, w: 0, h: 0 }); if (f.w > el.w) { el.x -= (f.w - el.w) / 2; el.w = f.w; } if (f.h > el.h) { el.y -= (f.h - el.h) / 2; el.h = f.h; } }

  if (JSON.stringify(before.els) !== JSON.stringify(els) && !(fresh && !v)) { undoStack.push(before); redoStack = []; }

}

// ---- keys
function del() {
  if (!sel.size) return;
  change(() => {
    const gone = new Set(sel);
    els = els.filter((e) => !gone.has(e.id)); // an arrow bound to a deleted shape stays, unbound
    sel.clear();
  });
}
function duplicate(ids, off) {
  const map = new Map();
  const src = ids.map(byId).filter(Boolean);
  for (const e of src) map.set(e.id, newId(e.type === "rect" ? "box" : e.type));
  const copies = src.map((e) => {
    const c = clone(e);
    c.id = map.get(e.id); c.seed = D.hash(c.id); c.by = "user";
    D.move(c, off, off);
    if (c.from) c.from = map.get(c.from) || c.from;
    if (c.to) c.to = map.get(c.to) || c.to;
    if (c.members) c.members = c.members.map((m) => map.get(m)).filter(Boolean);
    return c;
  });
  els.push(...copies);

  return copies.map((c) => c.id);

document.addEventListener("keydown", (e) => {

  if (mod && k === "d") { e.preventDefault(); return change(() => { sel = new Set(duplicate([...sel], 16)); }); }
  if (mod && k === "c") { clip = [...sel]; return; }
  if (mod && k === "v") { e.preventDefault(); return change(() => { sel = new Set(duplicate(clip.filter((id) => byId(id)), 24)); }); }

document.addEventListener("keyup", (e) => { if (e.key === " ") { spaceDown = false; if (!drag) stage.classList.remove("panning"); } });

// ---- the host
function why(err) {
  const reasons = { "-32031": "this view may not call that tool", "-32032": "the plugin is turned off", "-32033": "you declined it",
    "-32034": "not supported here", "-32035": "too many calls, it waits", "-32037": "click in the drawing first", "-32038": "too large" };

function status(text, err) { const s = $("status"); s.textContent = text ? "· " + text : ""; s.className = "status" + (err ? " err" : ""); }

let agentTimer = 0;

let lastMode = null;
app.on("context", (c) => {

app.on("tool-result", (r) => {

  if (s) { adopt(s, false); agentBase = clone(s.elements); setLive("live · rev " + s.rev, true); }

setTool("select");
